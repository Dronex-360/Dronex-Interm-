<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DroneX360 – Internes System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D6A3E;--greenL:#0D2E18;--greenM:#4CAF82;--greenB:#2D6B4F;
  --blue:#1976D2;--blueL:#0A1929;--blueB:#1E3A5F;
  --red:#EF5350;--redL:#2D0A0A;--redB:#5C1A1A;
  --orange:#FF7043;--orangeL:#2D1A0A;--orangeB:#7A3520;
  --amber:#FFB300;--amberL:#2D2000;--amberB:#7A5500;
  --purple:#9C27B0;--purpleL:#1A0A2D;--purpleB:#4A1B7A;
  --grey:#90A4AE;--greyL:#1A1A1A;--greyM:#78909C;
  --border:#2D2D2D;--text:#E0E0E0;--muted:#9E9E9E;
  --navy:#1565C0;
}
body{font-family:Arial,sans-serif;background:#0D0D0D;color:var(--text);font-size:13px;min-height:100vh}
*{font-family:Arial,sans-serif}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── APP SHELL ── */
.app-header{background:#000;color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:300;box-shadow:0 1px 0 #2D2D2D}
.app-header .logo{font-size:15px;font-weight:700;letter-spacing:.02em}
.app-header .logo span{opacity:.7;font-weight:400;font-size:12px;margin-left:6px}
.header-right{display:flex;align-items:center;gap:10px}
.user-pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px}

/* ── NAV ── */
.main-nav{background:#1E1E1E;border-bottom:2px solid var(--border);display:flex;gap:0;overflow-x:auto;position:sticky;top:52px;z-index:200}
.nav-btn{padding:12px 20px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.nav-btn:hover{color:#fff;background:#2A2A2A}
.nav-btn.active{color:#4CAF82;border-bottom-color:#4CAF82;font-weight:600}
.nav-btn .nav-icon{margin-right:5px}

/* ── LAYOUT ── */
.page{display:none;padding:16px;max-width:1100px;margin:0 auto}
.page.active{display:block}

/* ── CARDS ── */
.card{background:#1E1E1E;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:12px;font-weight:700;color:var(--grey);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-header{color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:600;margin:12px 0 0;display:flex;align-items:center;justify-content:space-between}

/* ── GRID HELPERS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.g-auto{grid-template-columns:1fr 1fr}}

/* ── FORM ── */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;background:#1E1E1E;color:var(--text);outline:none;font-size:13px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,106,62,.1)}
.field textarea{resize:vertical;min-height:64px}
.required::after{content:" *";color:var(--red)}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-grey{background:#2A2A2A;color:#B0B0B0;border:1px solid #3A3A3A}
.btn-red{background:var(--redL);color:var(--red);border:1px solid var(--redB)}
.btn-amber{background:var(--amberL);color:var(--amber);border:1px solid var(--amberB)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}

/* ── KPI ── */
.kpi{background:#1E1E1E;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kpi .k-label{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
.kpi .k-val{font-size:22px;font-weight:600;line-height:1.2}
.kpi .k-sub{font-size:10px;color:var(--muted);margin-top:3px}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:var(--green);color:#fff;padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr:nth-child(even) td{background:#1A1A1A}
table.t tr:hover td{background:#0D2E18}
table.t tfoot td{background:#0D2E18;font-weight:700;color:var(--greenM)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap}
.b-green{background:var(--greenL);color:var(--greenM)}
.b-blue{background:var(--blueL);color:var(--blue)}
.b-amber{background:var(--amberL);color:var(--amber)}
.b-red{background:var(--redL);color:var(--red)}
.b-purple{background:var(--purpleL);color:var(--purple)}
.b-grey{background:var(--greyL);color:var(--grey)}
.b-orange{background:var(--orangeL);color:var(--orange)}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:12px}
.modal-bg.open{display:flex}
.modal{background:#1E1E1E;border-radius:12px;padding:0;width:560px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 12px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;color:var(--grey);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1E1E1E;z-index:1}
.modal-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#1E1E1E}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding:10px 12px;background:#1E1E1E;border:1px solid var(--border);border-radius:8px}
.filter-bar .field{min-width:120px;flex:1}
.filter-bar label{font-size:10px}

/* ── STEMPEL ── */
.stempel-card{background:linear-gradient(135deg,var(--green),#2E7D32);color:#fff;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.stempel-time{font-size:42px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stempel-date{font-size:13px;opacity:.8;margin-top:4px}
.stempel-status{margin:12px 0;font-size:13px;font-weight:500;padding:6px 16px;border-radius:20px;display:inline-block}
.status-in{background:#1E1E1E;color:var(--greenM)}
.status-out{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.stempel-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.stempel-btn{padding:10px 24px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-kommen{background:#1E1E1E;color:var(--greenM)}
.btn-gehen{background:var(--redL);color:var(--red)}

/* ── CHIP LIST ── */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:16px;padding:4px 10px;font-size:11px;font-weight:500;margin:2px}
.chip button{background:none;border:none;cursor:pointer;font-size:13px;line-height:1;padding:0}

/* ── SETTINGS PAGE ── */
.settings-section{margin-bottom:20px}
.settings-section h3{font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{font-size:36px;margin-bottom:8px}


/* KI ASSISTENT */
#ai-chat-msgs{height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#0A0A0A;padding:12px;margin-bottom:10px}
.ai-msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.ai-msg.user{flex-direction:row-reverse}
.ai-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.ai-bubble{max-width:80%;border-radius:10px;padding:9px 13px;font-size:12px;line-height:1.6;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.ai-msg.user .ai-bubble{background:#0A2A1A;border-color:var(--greenB);color:#E0E0E0}
.ai-msg.bot .ai-bubble{background:#1A1A1A;border-color:var(--border);color:#E0E0E0}
.ai-key-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0A1929;border:1px solid var(--blueB);border-radius:8px;margin-bottom:10px;font-size:11px;flex-wrap:wrap}
.ai-key-bar input{flex:1;border:1px solid var(--blueB);border-radius:6px;padding:4px 8px;background:#0D0D0D;color:#90CAF9;font-size:11px;outline:none;font-family:monospace;min-width:120px}
.ai-input-row{display:flex;gap:8px;align-items:flex-end}
#ai-text{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;resize:none;min-height:50px;max-height:120px;background:#1A1A1A;color:var(--text);outline:none;font-family:Arial,sans-serif}
#ai-text:focus{border-color:var(--greenM)}
.mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1A1A1A;flex-shrink:0;transition:all .2s}
.mic-btn.recording{background:#C62828;border-color:#C62828;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ai-quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-quick{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#1A1A1A;color:var(--muted);font-size:11px;cursor:pointer}
.ai-quick:hover{background:var(--greenL);color:var(--greenM);border-color:var(--greenB)}
.cc-card{background:#0D2E18;border:1px solid var(--greenB);border-radius:8px;padding:10px 14px;margin-top:4px}
.cc-card .cc-title{color:var(--greenM);font-weight:600;margin-bottom:6px;font-size:13px}
.cc-card .cc-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--muted)}
.cc-card .cc-row span:last-child{color:var(--text);font-weight:500}

/* PRINT */
@media print{
  .main-nav,.app-header,.no-print,.filter-bar,.btn,.modal-bg{display:none!important}
  .page{display:block!important;padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:none}
  table.t th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- MODALS -->
<!-- Fahrt Modal -->
<div class="modal-bg" id="m-fahrt">
  <div class="modal">
    <div class="modal-head"><span id="fahrt-modal-title">🚗 Fahrt eintragen</span><button onclick="closeModal('m-fahrt')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="fahrt-edit-id"/>
      <div class="g2">
        <div class="field"><label class="required">Datum</label><input type="date" id="f-date"/></div>
        <div class="field"><label class="required">Fahrer</label><select id="f-driver"></select></div>
      </div>
      <div class="g3">
        <div class="field"><label class="required">Fahrzeug</label><select id="f-vehicle"></select></div>
        <div class="field"><label>KM-Stand Start</label><input type="number" id="f-km-s" placeholder="z.B. 12500" min="0"/></div>
        <div class="field"><label>KM-Stand Ende</label><input type="number" id="f-km-e" placeholder="z.B. 12680" min="0"/></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Von</label><input type="text" id="f-from" placeholder="Abfahrtsort"/></div>
        <div class="field"><label class="required">Nach</label><input type="text" id="f-to" placeholder="Zielort"/></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Kategorie</label>
          <select id="f-cat">
            <option>Geschäftlich</option><option>Kundenbesuch</option><option>Lieferung</option>
            <option>Behörde / Amt</option><option>Werkstatt / Tanken</option>
            <option>Privat (dienstlich veranlasst)</option><option>Sonstiges</option>
          </select>
        </div>
        <div class="field"><label>Gefahrene km</label><input type="number" id="f-km" placeholder="auto" min="0" style="background:#fafafa"/></div>
      </div>
      <div class="field"><label>Zweck / Notiz</label><textarea id="f-purpose" placeholder="Reisezweck, Kundenname…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-grey" onclick="closeModal('m-fahrt')">Abbrechen</button>
      <button class="btn btn-green" onclick="saveFahrt()">💾 Speichern</button>
    </div>
  </div>
</div>

<!-- Ausgabe Modal -->
<div class="modal-bg" id="m-ausgabe">
  <div class="modal">
    <div class="modal-head"><span id="ausgabe-modal-title">💸 Ausgabe eintragen</span><button onclick="closeModal('m-ausgabe')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="a-edit-id"/>
      <div class="g2">
        <div class="field"><label class="required">Datum</label><input type="date" id="a-date"/></div>
        <div class="field"><label class="required">Mitarbeiter</label><select id="a-driver"></select></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Betrag (€)</label><input type="number" id="a-amount" step="0.01" min="0" placeholder="0,00"/></div>
        <div class="field"><label class="required">Zahlungsart</label>
          <select id="a-pay">
            <option value="Bar">Bar</option><option value="Karte">Karte</option>
            <option value="Überweisung">Überweisung</option><option value="Sonstiges">Sonstiges</option>
          </select>
        </div>
      </div>
      <div class="field"><label class="required">Kategorie</label>
        <select id="a-cat">
          <option>Kraftstoff / Tanken</option><option>Verpflegung / Bewirtung</option>
          <option>Unterkunft / Hotel</option><option>Fahrzeug / Reparatur</option>
          <option>Büromaterial</option><option>Porto / Versand</option>
          <option>Telefon / Internet</option><option>Werkzeug / Material</option>
          <option>Parken / Maut</option><option>Sonstiges</option>
        </select>
      </div>
      <div class="field"><label class="required">Beschreibung</label><input type="text" id="a-desc" placeholder="Kurze Beschreibung der Ausgabe…"/></div>
      <div class="field"><label>Beleg-Hinweis</label><input type="text" id="a-beleg" placeholder="z.B. Kassenbon vorhanden, Foto in Ordner A, Rechnungs-Nr. 2026-045…"/></div>
      <div class="field"><label>Notiz</label><textarea id="a-note" placeholder="Weitere Informationen…" style="min-height:50px"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-grey" onclick="closeModal('m-ausgabe')">Abbrechen</button>
      <button class="btn btn-blue" onclick="saveAusgabe()">💾 Speichern</button>
    </div>
  </div>
</div>

<!-- Arbeitszeit manuell Modal -->
<div class="modal-bg" id="m-zeit">
  <div class="modal">
    <div class="modal-head"><span id="zeit-modal-title">⏱ Arbeitszeit eintragen</span><button onclick="closeModal('m-zeit')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="z-edit-id"/>
      <div class="g2">
        <div class="field"><label class="required">Datum</label><input type="date" id="z-date"/></div>
        <div class="field"><label class="required">Mitarbeiter</label><select id="z-driver"></select></div>
      </div>
      <div class="g3">
        <div class="field"><label class="required">Kommen</label><input type="time" id="z-start"/></div>
        <div class="field"><label class="required">Gehen</label><input type="time" id="z-end"/></div>
        <div class="field"><label>Pause (Min)</label><input type="number" id="z-break" placeholder="30" min="0"/></div>
      </div>
      <div class="field"><label>Tätigkeit / Projekt</label><input type="text" id="z-task" placeholder="z.B. Drohnenflug Baustelle A, Büro, Kundentermin…"/></div>
      <div class="field"><label>Notiz</label><textarea id="z-note" placeholder="Besonderheiten, Überstunden-Grund…" style="min-height:50px"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-grey" onclick="closeModal('m-zeit')">Abbrechen</button>
      <button class="btn btn-amber" onclick="saveZeit()">💾 Speichern</button>
    </div>
  </div>
</div>

const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByanhudmVsbG1pbXF5a2t0Z2xiIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NTQ0MTcwNywiZXhwIjoyMTAxMDE3NzA3fQ.Iazn9g24gKTMCpbJQ17Wmh-2jES1B7A2VzF4UdktSbw";

async function supaFetch(table, method, body, filter) {
  method = method || 'GET';
  filter = filter || '';
  const url = SUPA_URL + '/rest/v1/' + table + filter;
  const headers = {};
  headers['apikey'] = SUPA_KEY;
  headers['Authorization'] = 'Bearer ' + SUPA_KEY;
  headers['Content-Type'] = 'application/json';
  if(method === 'POST') headers['Prefer'] = 'return=representation';
  if(method === 'PATCH') headers['Prefer'] = 'return=representation';
  const opts = {method: method, headers: headers};
  if(body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(url, opts);
    if(method === 'DELETE') return [];
    const text = await r.text();
    if(!text) return [];
    const parsed = JSON.parse(text);
    return Array.isArray(parsed) ? parsed : [];
  } catch(err) {
    console.error('supaFetch error:', err);
    return [];
  }
}

async function loadAll() {
  showLoading(true);
  try {
    const [fahrten, ausgaben, zeiten] = await Promise.all([
      supaFetch('fahrten', 'GET', null, '?order=datum.desc'),
      supaFetch('ausgaben', 'GET', null, '?order=datum.desc'),
      supaFetch('arbeitszeiten', 'GET', null, '?order=datum.desc'),
    ]);
    S.fahrten  = Array.isArray(fahrten)  ? fahrten.map(r=>  ({id:r.id,date:r.datum,driver:r.fahrer,vehicle:r.fahrzeug,from:r.von,to:r.nach,km:r.km,kmStart:r.km_start,kmEnd:r.km_end,cat:r.kategorie,purpose:r.zweck}))  : [];
    S.ausgaben = Array.isArray(ausgaben) ? ausgaben.map(r=> ({id:r.id,date:r.datum,driver:r.fahrer,amount:r.betrag,pay:r.zahlungsart,cat:r.kategorie,desc:r.beschreibung,beleg:r.beleg,note:r.notiz})) : [];
    S.zeiten   = Array.isArray(zeiten)   ? zeiten.map(r=>   ({id:r.id,date:r.datum,driver:r.fahrer,start:r.kommen,end:r.gehen,brk:r.pause_min,task:r.taetigkeit,note:r.notiz}))   : [];
  } catch(e) {
    console.error('Supabase Ladefehler:', e);
    S.fahrten=[]; S.ausgaben=[]; S.zeiten=[];
  } finally {
    showLoading(false);
    renderPage(currentPage);
  }
}

function showLoading(on) {
  let el = document.getElementById('loading-bar');
  if(!el) { el=document.createElement('div'); el.id='loading-bar';
    el.style.cssText='position:fixed;top:52px;left:0;right:0;height:3px;background:linear-gradient(90deg,#4CAF82,#00BCD4);z-index:999;transition:opacity .3s';
    document.body.appendChild(el); }
  el.style.opacity = on?'1':'0';
}

const today = () => new Date().toISOString().slice(0,10);
const nowTime = () => new Date().toTimeString().slice(0,5);
const fmtDate = s => s?new Date(s+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const fmtTime = s => s||'–';
const fmtEur = v => (parseFloat(v)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtKm = v => (parseFloat(v)||0).toLocaleString('de-DE',{maximumFractionDigits:0})+' km';
const fmtH = v => { const h=Math.floor(v); const m=Math.round((v-h)*60); return `${h}h ${m<10?'0':''}${m}m`; };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const monthOf = d => (d||'').slice(0,7);
const monthLabel = s => { if(!s) return ''; const [y,m]=s.split('-'); return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'}); };
const curMonth = () => new Date().toISOString().slice(0,7);

function getMonths(arr){ return [...new Set(arr.map(e=>monthOf(e.date)).filter(Boolean))].sort().reverse(); }

function calcZeit(e){
  if(!e.start||!e.end) return 0;
  const [sh,sm]=e.start.split(':').map(Number);
  const [eh,em]=e.end.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm)-(parseInt(e.brk)||0);
  return Math.max(0,mins/60);
}

let currentPage = 'dashboard';
function showPage(p){
  currentPage = p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const nb = document.getElementById('nav-'+p);
  if(nb) nb.classList.add('active');
  renderPage(p);
}
function renderPage(p){
  if(p==='dashboard') renderDashboard();
  else if(p==='fahrtenbuch') renderFahrtenbuch();
  else if(p==='ausgaben') renderAusgaben();
  else if(p==='arbeitszeit') renderArbeitszeit();
  else if(p==='assistent') renderAssistent();
  else if(p==='settings') renderSettings();
}

function getAnthropicKey(){ return localStorage.getItem('dx_ant_key')||''; }
function setAnthropicKey(k){ localStorage.setItem('dx_ant_key',k.trim()); }

async function callClaude(messages, system){
  const key = getAnthropicKey();
  if(!key) throw new Error('Kein API-Key');
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,system:system,messages:messages}),
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return d.content?.find(b=>b.type==='text')?.text||'';
}

let aiMsgs = [{role:'bot',content:'Hallo! Ich bin dein DroneX360 Assistent.\n\nSag mir einfach was du eintragen möchtest:\n\n• "Heute von Offenburg nach Freiburg, 68 km, OG X553"\n• "45 Euro Kraftstoff, bar bezahlt"\n• "Ich bin um 8 Uhr gekommen, 30 Min Pause, Feierabend 17 Uhr"\n\nOder nutze das Mikrofon 🎤 zum Sprechen.'}];
let aiLoading = false;
let aiListening = false;
let aiRecognition = null;

async function processAiInput(text){
  if(!text.trim()||aiLoading) return;
  const key = getAnthropicKey();
  if(!key){
    document.getElementById('ai-key-inp')?.focus();
    aiMsgs.push({role:'bot',content:'Bitte zuerst den Anthropic API-Key oben eingeben und speichern.'});
    renderAssistent(); return;
  }
  aiMsgs.push({role:'user',content:text});
  aiLoading=true; renderAssistent();

  const today = new Date().toLocaleDateString('de-DE');
  const todayISO = new Date().toISOString().slice(0,10);
  const curUser = S.activeUser||S.drivers[0]||'Unbekannt';
  const driverList = S.drivers.join(', ');
  const vehList = S.vehicles.join(', ');

  const system = 'Du bist ein interner Assistent fuer DroneX360 UG.\n' +
    'Mitarbeiter: ' + driverList + '\n' +
    'Fahrzeuge: ' + vehList + '\n' +
    'Aktueller Nutzer: ' + curUser + '\n' +
    'Heute: ' + today + ' (ISO: ' + todayISO + ')\n\n' +
    'Wenn der Nutzer eine Fahrt, Ausgabe oder Arbeitszeit beschreibt, antworte NUR mit diesem JSON:\n' +
    '{"typ":"fahrt","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","fahrzeug":"KFZ","von":"Ort","nach":"Ort","km":0,"kategorie":"Geschaeftlich","zweck":""},"bestaetigung":"Kurze Zusammenfassung"}\n' +
    'oder\n' +
    '{"typ":"ausgabe","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","betrag":0.0,"zahlungsart":"Bar","kategorie":"Kraftstoff / Tanken","beschreibung":"","beleg":""},"bestaetigung":"..."}\n' +
    'oder\n' +
    '{"typ":"arbeitszeit","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","start":"HH:MM","end":"HH:MM","brk":30,"task":""},"bestaetigung":"..."}\n\n' +
    'Fuer allgemeine Fragen antworte normal auf Deutsch ohne JSON.\n' +
    'Fehlende Infos: Frage kurz nach. Datum = heute falls nicht genannt. Fahrer = aktueller Nutzer falls nicht genannt.';

  const apiMsgs = aiMsgs.filter(m=>m.role==='user'||m.content!=='confirmed').map(m=>({
    role: m.role==='user'?'user':'assistant',
    content: m.content
  }));

  try {
    const reply = await callClaude(apiMsgs, system);
    const match = reply.match(/\{[\s\S]*"typ"[\s\S]*\}/);
    if(match){
      const parsed = JSON.parse(match[0]);
      await applyAiEntry(parsed);
      aiMsgs.push({role:'bot',content:'confirmed',data:parsed});
    } else {
      aiMsgs.push({role:'bot',content:reply});
    }
  } catch(e){
    aiMsgs.push({role:'bot',content:'Fehler: '+e.message});
  }
  aiLoading=false; renderAssistent();
  setTimeout(()=>{const el=document.getElementById('ai-chat-msgs');if(el) el.scrollTop=el.scrollHeight;},100);
}

async function applyAiEntry(p){
  const d=p.daten||{};
  const date=d.datum||new Date().toISOString().slice(0,10);
  const driver=d.fahrer||S.activeUser||S.drivers[0];
  if(p.typ==='fahrt'){
    await supaFetch('fahrten','POST',{id:uid(),datum:date,fahrer:driver,fahrzeug:d.fahrzeug||'',von:d.von||'',nach:d.nach||'',km:parseFloat(d.km)||0,km_start:0,km_end:0,kategorie:d.kategorie||'Geschaeftlich',zweck:d.zweck||''});
  } else if(p.typ==='ausgabe'){
    await supaFetch('ausgaben','POST',{id:uid(),datum:date,fahrer:driver,betrag:parseFloat(d.betrag)||0,zahlungsart:d.zahlungsart||'Bar',kategorie:d.kategorie||'Sonstiges',beschreibung:d.beschreibung||'',beleg:d.beleg||'',notiz:''});
  } else if(p.typ==='arbeitszeit'){
    await supaFetch('arbeitszeiten','POST',{id:uid(),datum:date,fahrer:driver,kommen:d.start||'',gehen:d.end||'',pause_min:parseInt(d.brk)||0,taetigkeit:d.task||'',notiz:''});
  }
  await loadAll();
}

function startMic(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Spracheingabe nur in Chrome verfuegbar.');return;}
  if(aiListening){aiRecognition&&aiRecognition.stop();aiListening=false;renderAssistent();return;}
  aiRecognition=new SR();
  aiRecognition.lang='de-DE';
  aiRecognition.continuous=false;
  aiRecognition.interimResults=false;
  aiRecognition.onresult=e=>{
    const txt=e.results[0][0].transcript;
    const inp=document.getElementById('ai-text');
    if(inp) inp.value=txt;
    aiListening=false;renderAssistent();
    processAiInput(txt);
  };
  aiRecognition.onerror=aiRecognition.onend=()=>{aiListening=false;renderAssistent();};
  aiRecognition.start();
  aiListening=true;renderAssistent();
}

function sendAiMsg(){
  const inp=document.getElementById('ai-text');
  if(!inp||!inp.value.trim()) return;
  const txt=inp.value.trim(); inp.value='';
  processAiInput(txt);
}

async function saveFahrt(){
  const date=document.getElementById('f-date').value;
  const driver=document.getElementById('f-driver').value;
  const vehicle=document.getElementById('f-vehicle').value;
  const from=document.getElementById('f-from').value.trim();
  const to=document.getElementById('f-to').value.trim();
  if(!date||!driver||!vehicle||!from||!to){ alert('Bitte alle Pflichtfelder (*) ausfüllen.'); return; }
  const kmStart=parseFloat(document.getElementById('f-km-s').value)||0;
  const kmEnd=parseFloat(document.getElementById('f-km-e').value)||0;
  const km=parseFloat(document.getElementById('f-km').value)||(kmEnd>kmStart?Math.round(kmEnd-kmStart):0);
  const cat=document.getElementById('f-cat').value;
  const purpose=document.getElementById('f-purpose').value.trim();
  const editId=document.getElementById('fahrt-edit-id').value;
  const entry={id:editId||uid(),date,driver,vehicle,from,to,km,kmStart,kmEnd,cat,purpose};
  if(editId){
    await supaFetch('fahrten','PATCH',{datum:date,fahrer:driver,fahrzeug:vehicle,von:from,nach:to,km,km_start:kmStart,km_end:kmEnd,kategorie:cat,zweck:purpose},`?id=eq.${editId}`);
  } else {
    await supaFetch('fahrten','POST',{id:entry.id,datum:date,fahrer:driver,fahrzeug:vehicle,von:from,nach:to,km,km_start:kmStart,km_end:kmEnd,kategorie:cat,zweck:purpose});
  }
  closeModal('m-fahrt'); await loadAll();
}

  const amount=parseFloat(document.getElementById('a-amount').value)||0;
  const desc=document.getElementById('a-desc').value.trim();
  if(!date||!driver||!amount||!desc){ alert('Bitte alle Pflichtfelder (*) ausfüllen.'); return; }
  const pay=document.getElementById('a-pay').value;
  const cat=document.getElementById('a-cat').value;
  const beleg=document.getElementById('a-beleg').value.trim();
  const note=document.getElementById('a-note').value.trim();
  const editId=document.getElementById('a-edit-id').value;
  const entry={id:editId||uid(),date,driver,amount,pay,cat,desc,beleg,note};
  if(editId){
    await supaFetch('ausgaben','PATCH',{datum:date,fahrer:driver,betrag:amount,zahlungsart:pay,kategorie:cat,beschreibung:desc,beleg,notiz:note},`?id=eq.${editId}`);
  } else {
    await supaFetch('ausgaben','POST',{id:entry.id,datum:date,fahrer:driver,betrag:amount,zahlungsart:pay,kategorie:cat,beschreibung:desc,beleg,notiz:note});
  }
  closeModal('m-ausgabe'); await loadAll();
}
async function deleteAusgabe(id){ if(confirm('Eintrag löschen?')){ await supaFetch('ausgaben','DELETE',null,`?id=eq.${id}`); await loadAll(); } }

async function stempelKommen(){
  if(!S.activeUser){ alert('Bitte zuerst deinen Namen unter Einstellungen wählen.'); showPage('settings'); return; }
  const already=S.zeiten.find(e=>e.driver===S.activeUser&&!e.end&&e.date===today());
  if(already){ alert('Du bist bereits eingestempelt!'); return; }
  const newId=uid();
  await supaFetch('arbeitszeiten','POST',{id:newId,datum:today(),fahrer:S.activeUser,kommen:nowTime(),gehen:'',pause_min:0,taetigkeit:'',notiz:''});
  await loadAll();
}
async function stempelGehen(){
  if(!S.activeUser){ alert('Bitte zuerst deinen Namen wählen.'); return; }
  const openEntry=[...S.zeiten].reverse().find(e=>e.driver===S.activeUser&&!e.end);
  if(!openEntry){ alert('Du bist nicht eingestempelt.'); return; }
  const brk=prompt('Pause in Minuten (0 wenn keine Pause):','30');
  await supaFetch('arbeitszeiten','PATCH',{gehen:nowTime(),pause_min:parseInt(brk)||0},`?id=eq.${openEntry.id}`);
  await loadAll();
}
function openZeitModal(id){
  fillDriverSel('z-driver', S.activeUser||S.drivers[0]||'');
  document.getElementById('z-edit-id').value='';
  document.getElementById('zeit-modal-title').textContent='⏱ Arbeitszeit eintragen';
  document.getElementById('z-date').value=today();
  document.getElementById('z-start').value='08:00'; document.getElementById('z-end').value='17:00';
  document.getElementById('z-break').value='30'; document.getElementById('z-task').value='';
  document.getElementById('z-note').value='';
  if(id){ const e=S.zeiten.find(x=>x.id===id); if(e){
    document.getElementById('zeit-modal-title').textContent='⏱ Arbeitszeit bearbeiten';
    document.getElementById('z-edit-id').value=e.id;
    document.getElementById('z-date').value=e.date||'';
    document.getElementById('z-driver').value=e.driver||'';
    document.getElementById('z-start').value=e.start||''; document.getElementById('z-end').value=e.end||'';
    document.getElementById('z-break').value=e.brk||0;
    document.getElementById('z-task').value=e.task||''; document.getElementById('z-note').value=e.note||'';
  }}
  document.getElementById('m-zeit').classList.add('open');
}
function editZeit(id){ openZeitModal(id); }

  const editId=document.getElementById('z-edit-id').value;

    await supaFetch('arbeitszeiten','PATCH',{datum:date,fahrer:driver,kommen:start,gehen:end,pause_min:brk,taetigkeit:task,notiz:note},`?id=eq.${editId}`);
  } else {
    await supaFetch('arbeitszeiten','POST',{id:entry.id,datum:date,fahrer:driver,kommen:start,gehen:end,pause_min:brk,taetigkeit:task,notiz:note});

// ══════════════════════════════════════════════════════
// CSV EXPORT
// ══════════════════════════════════════════════════════
function exportCSV(type){
  let rows, header, name;
  if(type==='fahrten'){
    header=['Datum','Fahrer','Fahrzeug','Von','Nach','km','KM-Start','KM-Ende','Kategorie','Zweck'];
    const list=S.fahrten.filter(e=>(F.fMonth?monthOf(e.date)===F.fMonth:true)&&(F.fDriver?e.driver===F.fDriver:true)&&(F.fVehicle?e.vehicle===F.fVehicle:true));
    rows=list.map(e=>[fmtDate(e.date),e.driver,e.vehicle,e.from,e.to,e.km||0,e.kmStart||'',e.kmEnd||'',e.cat,e.purpose||'']);
    name='Fahrtenbuch';
  } else if(type==='ausgaben'){
    header=['Datum','Mitarbeiter','Betrag','Zahlungsart','Kategorie','Beschreibung','Beleg','Notiz'];
    const list=S.ausgaben.filter(e=>(F.aMonth?monthOf(e.date)===F.aMonth:true)&&(F.aDriver?e.driver===F.aDriver:true));
    rows=list.map(e=>[fmtDate(e.date),e.driver,e.amount||0,e.pay,e.cat,e.desc,e.beleg||'',e.note||'']);
    name='Ausgaben';
  } else {
    header=['Datum','Mitarbeiter','Kommen','Gehen','Pause (Min)','Stunden','Tätigkeit','Notiz'];
    const list=S.zeiten.filter(e=>(F.zMonth?monthOf(e.date)===F.zMonth:true)&&(F.zDriver?e.driver===F.zDriver:true));
    rows=list.map(e=>[fmtDate(e.date),e.driver,e.start||'',e.end||'',e.brk||0,fmtH(calcZeit(e)),e.task||'',e.note||'']);
    name='Arbeitszeit';
  }
  const csv='\uFEFF'+[header,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`DroneX360_${name}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
