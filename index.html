<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRNX360 OS | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#111827;height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{width:420px;background:#fff;padding:45px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{font-size:34px;font-weight:700;color:#ff6b00;text-align:center}
.subtitle{text-align:center;margin-top:10px;color:#666}
input{width:100%;padding:15px;margin-top:18px;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{width:100%;padding:16px;margin-top:25px;border:none;background:#ff6b00;color:#fff;font-size:16px;font-weight:600;border-radius:10px;cursor:pointer}
button:hover{background:#ff5200}
.footer{text-align:center;margin-top:25px;font-size:13px;color:#999}
.version{margin-top:8px;font-size:12px}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">DRNX360 OS</div>
<div class="subtitle">Enterprise Drone Operations Platform</div>
<input type="email" placeholder="E-Mail">
<input type="password" placeholder="Passwort">
<button onclick="window.location='dashboard.html'">Login</button>
<div class="footer">
© 2026 DRNX360
<div class="version">Version 0.1</div>
</div>
</div>
</body>
</html>
