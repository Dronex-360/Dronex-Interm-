<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DroneX360 – Internes System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0D0D0D;color:#E0E0E0;font-size:13px;min-height:100vh}
input,textarea,button,select{font-family:Arial,sans-serif;font-size:13px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
:root{
  --green:#1D6A3E;--greenL:#0D2E18;--greenM:#4CAF82;--greenB:#2D6B4F;
  --blue:#1976D2;--blueL:#0A1929;--blueB:#1E3A5F;
  --red:#EF5350;--redL:#2D0A0A;--redB:#5C1A1A;
  --amber:#FFB300;--amberL:#2D2000;--amberB:#7A5500;
  --grey:#90A4AE;--greyL:#1A1A1A;
  --border:#2D2D2D;--text:#E0E0E0;--muted:#9E9E9E;
  --s0:#0D0D0D;--s1:#1A1A1A;--s2:#252525;
}
.app-header{background:#000;color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:300;border-bottom:1px solid #2D2D2D}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:36px;width:auto}
.logo span{font-size:11px;color:rgba(255,255,255,.6)}
.header-right{display:flex;align-items:center;gap:10px}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px}
.role-dot{width:7px;height:7px;border-radius:50%}
.main-nav{background:#141414;border-bottom:2px solid var(--border);display:flex;overflow-x:auto;position:sticky;top:52px;z-index:200}
.nav-btn{padding:12px 16px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.nav-btn:hover{color:#fff;background:#1A1A1A}
.nav-btn.active{color:#4CAF82;border-bottom-color:#4CAF82;font-weight:600}
.page{display:none;padding:14px;max-width:1100px;margin:0 auto}
.page.active{display:block}
.card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--grey);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:1px solid var(--border)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;background:#252525;color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--greenM)}
.field textarea{resize:vertical;min-height:64px}
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.88}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:#1565C0;color:#fff}
.btn-grey{background:#2A2A2A;color:#B0B0B0;border:1px solid #3A3A3A}
.btn-red{background:var(--redL);color:var(--red);border:1px solid var(--redB)}
.btn-amber{background:var(--amberL);color:var(--amber);border:1px solid var(--amberB)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.k-label{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
.k-val{font-size:22px;font-weight:600;line-height:1.2}
.k-sub{font-size:10px;color:var(--muted);margin-top:3px}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:var(--green);color:#fff;padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr:nth-child(even) td{background:#181818}
table.t tr:hover td{background:var(--greenL)}
table.t tfoot td{background:var(--greenL);font-weight:700;color:var(--greenM)}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap}
.b-green{background:var(--greenL);color:var(--greenM)}
.b-blue{background:var(--blueL);color:var(--blue)}
.b-amber{background:var(--amberL);color:var(--amber)}
.b-grey{background:var(--greyL);color:var(--grey)}
.status-badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600}
.status-offen{background:var(--amberL);color:var(--amber);border:1px solid var(--amberB)}
.status-in_bearbeitung{background:var(--blueL);color:var(--blue);border:1px solid var(--blueB)}
.status-abgeschlossen{background:var(--greenL);color:var(--greenM);border:1px solid var(--greenB)}
.typ-badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600}
.typ-reinigung{background:var(--greenL);color:var(--greenM);border:1px solid var(--greenB)}
.typ-inspektion{background:var(--blueL);color:var(--blue);border:1px solid var(--blueB)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;padding:12px}
.modal-bg.open{display:flex}
.modal{background:var(--s1);border-radius:12px;width:560px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 12px 50px rgba(0,0,0,.5);display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;color:var(--grey);display:flex;align-items:center;justify-content:space-between;background:var(--s1)}
.modal-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--s1)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding:10px 12px;background:var(--s1);border:1px solid var(--border);border-radius:8px}
.filter-bar .field{min-width:120px;flex:1}
.stempel-card{background:linear-gradient(135deg,var(--green),#2E7D32);color:#fff;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.stempel-time{font-size:42px;font-weight:700;letter-spacing:.04em}
.stempel-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.stempel-btn{padding:10px 24px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btn-kommen{background:#fff;color:var(--greenM)}
.btn-gehen{background:var(--redL);color:var(--red)}
.ai-key-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0A1929;border:1px solid var(--blueB);border-radius:8px;margin-bottom:10px;font-size:11px;flex-wrap:wrap}
.ai-key-bar input{flex:1;border:1px solid var(--blueB);border-radius:6px;padding:4px 8px;background:#0D0D0D;color:#90CAF9;font-size:11px;outline:none;min-width:120px}
#ai-chat-msgs{height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#080808;padding:12px;margin-bottom:10px}
.ai-msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.ai-msg.user{flex-direction:row-reverse}
.ai-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.ai-bubble{max-width:80%;border-radius:10px;padding:9px 13px;font-size:12px;line-height:1.6;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.ai-msg.user .ai-bubble{background:#0A2A1A;border-color:var(--greenB);color:var(--text)}
.ai-msg.bot .ai-bubble{background:var(--s2);color:var(--text)}
.ai-quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-quick{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--s1);color:var(--muted);font-size:11px;cursor:pointer}
.ai-quick:hover{background:var(--greenL);color:var(--greenM)}
.ai-input-row{display:flex;gap:8px;align-items:flex-end}
#ai-text{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;resize:vertical;min-height:50px;max-height:120px;background:var(--s2);color:var(--text);outline:none}
.mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--s1);flex-shrink:0}
.mic-btn.recording{background:#C62828;border-color:#C62828;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cc-card{background:var(--greenL);border:1px solid var(--greenB);border-radius:8px;padding:10px 14px;margin-top:4px}
.cc-card .cc-title{color:var(--greenM);font-weight:600;margin-bottom:6px}
.cc-card .cc-row{display:flex;justify-content:space-between;color:var(--muted);padding:2px 0;font-size:11px}
.auftrag-detail{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.ad-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ad-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ad-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.foto-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--s1)}
.foto-card img{width:100%;height:100px;object-fit:cover;display:block}
.foto-card .foto-lbl{padding:5px 8px;font-size:10px;color:var(--muted)}
.foto-upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px}
.foto-upload-zone:hover{border-color:var(--greenM);color:var(--greenM)}
.ki-result{background:#080808;border:1px solid var(--greenB);border-radius:8px;padding:12px;font-size:12px;color:#B0BEC5;line-height:1.8;white-space:pre-wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:16px;padding:4px 10px;font-size:11px;font-weight:500;margin:2px}
.chip button{background:none;border:none;cursor:pointer;font-size:13px;line-height:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{font-size:36px;margin-bottom:8px}
.pdf-preview{background:#fff;padding:20px;color:#212121;font-family:Arial,sans-serif;font-size:12px;line-height:1.6}
.pdf-preview h2{font-size:14px;color:#37474F;margin:12px 0 6px;border-bottom:1px solid #eee;padding-bottom:4px}
.pdf-preview table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
.pdf-preview table td{padding:5px 8px;border:1px solid #e0e0e0}
.pdf-preview table tr:nth-child(even) td{background:#f5f5f5}
#login-screen{position:fixed;inset:0;background:#0D0D0D;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
#login-screen.show{display:flex}
.login-box{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:24px}
.login-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;text-align:center}
.login-desc{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.login-field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;background:#252525;color:var(--text);font-size:13px;outline:none}
.login-field input:focus{border-color:var(--greenM)}
.login-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.login-btn:disabled{background:#333;color:#666;cursor:not-allowed}
.login-error{border-radius:6px;padding:8px 12px;font-size:12px;margin-top:10px;display:none}
.login-error.show{display:block;background:var(--redL);border:1px solid var(--redB);color:var(--red)}
.login-error.info{display:block;background:var(--greenL);border:1px solid var(--greenB);color:var(--greenM)}
.login-forgot{text-align:center;margin-top:12px;font-size:12px;color:var(--muted)}
.login-forgot a{color:var(--greenM);cursor:pointer}
@media print{
  body>*{display:none!important}
  #pdf-content{display:block!important;position:fixed;inset:0;padding:20px;background:#fff;color:#212121;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pdf-content *{display:revert!important}
}
</style>
</head>

<div class="modal-bg" id="m-fahrt">
  <div class="modal">

      <input type="hidden" id="fahrt-edit-id"/>

        <div class="field"><label>Datum *</label><input type="date" id="f-date"/></div>
        <div class="field"><label>Fahrer *</label><select id="f-driver"></select></div>
      </div>
      <div class="g3">
        <div class="field"><label>Fahrzeug *</label><select id="f-vehicle"></select></div>
        <div class="field"><label>KM Start</label><input type="number" id="f-km-s" min="0"/></div>
        <div class="field"><label>KM Ende</label><input type="number" id="f-km-e" min="0"/></div>
      </div>
      <div class="g2">
        <div class="field"><label>Von *</label><input type="text" id="f-from"/></div>
        <div class="field"><label>Nach *</label><input type="text" id="f-to"/></div>
      </div>
      <div class="g2">
        <div class="field"><label>Kategorie</label>
          <select id="f-cat">

    </div>

async function supaFetch(table, method, body, filter) {
  method = method || 'GET'; filter = filter || '';
  const url = SUPA_URL + '/rest/v1/' + table + filter;
  const token = localStorage.getItem('dx_access_token') || SUPA_KEY;
  const headers = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  if(method === 'POST') headers['Prefer'] = 'return=representation';
  if(method === 'PATCH') headers['Prefer'] = 'return=representation';
  const opts = { method, headers };
  if(body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(url, opts);
    if(method === 'DELETE') return [];
    const text = await r.text();
    if(!text) return [];
    const parsed = JSON.parse(text);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e) { console.error('supaFetch:', e); return []; }
}

async function loadAll() {
  showLoading(true);
  try {
    const [f, a, z, au] = await Promise.all([
      supaFetch('fahrten','GET',null,'?order=datum.desc'),
      supaFetch('ausgaben','GET',null,'?order=datum.desc'),
      supaFetch('arbeitszeiten','GET',null,'?order=datum.desc'),
      supaFetch('auftraege','GET',null,'?order=erstellt_am.desc')
    ]);
    S.fahrten = f.map(r => ({id:r.id,date:r.datum,driver:r.fahrer,vehicle:r.fahrzeug,from:r.von,to:r.nach,km:r.km,kmStart:r.km_start,kmEnd:r.km_end,cat:r.kategorie,purpose:r.zweck}));
    S.ausgaben = a.map(r => ({id:r.id,date:r.datum,driver:r.fahrer,amount:r.betrag,pay:r.zahlungsart,cat:r.kategorie,desc:r.beschreibung,beleg:r.beleg,note:r.notiz}));
    S.zeiten = z.map(r => ({id:r.id,date:r.datum,driver:r.fahrer,start:r.kommen,end:r.gehen,brk:r.pause_min,task:r.taetigkeit,note:r.notiz}));
    auftraege = Array.isArray(au) ? au : [];
    window._auftraege = auftraege;
  } catch(e) { console.error('loadAll:', e); }
  finally { showLoading(false); renderPage(currentPage); setTimeout(renderDashAuftraege,100); }
}

function showLoading(on) {
  let el = document.getElementById('loading-bar');
  if(!el) { el=document.createElement('div'); el.id='loading-bar'; el.style.cssText='position:fixed;top:52px;left:0;right:0;height:3px;background:linear-gradient(90deg,#4CAF82,#00BCD4);z-index:999;transition:opacity .3s'; document.body.appendChild(el); }
  el.style.opacity = on ? '1' : '0';
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  const btn = document.getElementById('l-btn');
  if(!email||!pass) { showErr('Bitte E-Mail und Passwort eingeben.'); return; }
  btn.disabled=true; btn.textContent='Anmelden…';
  clearErr();
  try {
    const r = await fetch(SUPA_URL+'/auth/v1/token?grant_type=password', {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body: JSON.stringify({email,password:pass})
    });
    const d = await r.json();
    if(d.access_token) {
      localStorage.setItem('dx_access_token', d.access_token);
      localStorage.setItem('dx_refresh_token', d.refresh_token);
      await loadUserProfile(d.user.id);
      hideLogin();
      await loadAll();
    } else { showErr('Falsche E-Mail oder Passwort.'); }
  } catch(e) { showErr('Verbindungsfehler: '+e.message); }
  btn.disabled=false; btn.textContent='Anmelden';
}

async function doReset() {
  const email = document.getElementById('l-email').value.trim();
  if(!email) { showErr('Bitte zuerst E-Mail eingeben.'); return; }
  await fetch(SUPA_URL+'/auth/v1/recover', {method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({email})});
  const el=document.getElementById('l-error'); if(el){el.textContent='Reset-E-Mail gesendet!';el.className='login-error info';}
}

async function doLogout() {
  if(!confirm('Wirklich abmelden?')) return;
  localStorage.removeItem('dx_access_token'); localStorage.removeItem('dx_refresh_token');
  currentProfile=null; S.activeUser=''; S.fahrten=[]; S.ausgaben=[]; S.zeiten=[];
  showLogin();
}

function showErr(msg) { const el=document.getElementById('l-error'); if(el){el.textContent=msg;el.className='login-error show';} }
function clearErr() { const el=document.getElementById('l-error'); if(el){el.textContent='';el.className='login-error';} }
function showLogin() { document.getElementById('login-screen').classList.add('show'); document.getElementById('l-email').value=''; document.getElementById('l-pass').value=''; }
function hideLogin() { document.getElementById('login-screen').classList.remove('show'); }

async function loadUserProfile(userId) {
  const token = localStorage.getItem('dx_access_token') || SUPA_KEY;
  const r = await fetch(SUPA_URL+'/rest/v1/user_profiles?id=eq.'+userId, {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}});
  const profiles = await r.json();
  if(profiles && profiles[0]) {
    currentProfile = profiles[0];
    S.activeUser = currentProfile.name;
    const isAdmin = currentProfile.rolle === 'admin';
    const lbl=document.getElementById('active-user-label'); if(lbl) lbl.textContent=currentProfile.name;
    const rl=document.getElementById('role-label'); if(rl) rl.textContent=isAdmin?'Admin':'Mitarbeiter';
    const dot=document.getElementById('role-dot'); if(dot) dot.style.background=isAdmin?'#FFB300':'#4CAF82';
    const bt=document.getElementById('nav-buchhaltung'); if(bt) bt.style.display=isAdmin?'':'none';
  }
}

async function checkSession() {
  const token = localStorage.getItem('dx_access_token');
  if(!token) { showLogin(); return; }
  try {
    const r = await fetch(SUPA_URL+'/auth/v1/user', {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}});
    const text = await r.text();
    if(!text) { showLogin(); return; }
    const user = JSON.parse(text);
    if(user && user.id) { await loadUserProfile(user.id); hideLogin(); await loadAll(); }
    else showLogin();
  } catch(e) { console.error('checkSession:',e); showLogin(); }
}

setInterval(async () => {
  const refresh = localStorage.getItem('dx_refresh_token');
  if(!refresh) return;
  const r = await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({refresh_token:refresh})});
  const d = await r.json();
  if(d.access_token) { localStorage.setItem('dx_access_token',d.access_token); localStorage.setItem('dx_refresh_token',d.refresh_token); }
}, 50*60*1000);

const getAnthropicKey = () => localStorage.getItem('dx_ant_key') || ANT_KEY_DEFAULT;
const setAnthropicKey = k => localStorage.setItem('dx_ant_key', k.trim());

async function callClaude(messages, system) {
  const key = getAnthropicKey();
  if(!key) throw new Error('Kein API-Key');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system,messages})
  });
  if(!r.ok) { const e=await r.json().catch(()=>({})); throw new Error(e.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return d.content?.find(b=>b.type==='text')?.text || '';
}

  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p)?.classList.add('active');
  document.getElementById('nav-'+p)?.classList.add('active');
  renderPage(p);
}

function renderPage(p) {
  if(p==='dashboard') renderDashboard();
  else if(p==='fahrtenbuch') renderFahrtenbuch();
  else if(p==='ausgaben') renderAusgaben();
  else if(p==='arbeitszeit') renderArbeitszeit();
  else if(p==='auftraege') renderAuftraege();
  else if(p==='assistent') renderAssistent();
  else if(p==='buchhaltung') renderBuchhaltung();
  else if(p==='settings') renderSettings();
}

function renderDashboard() {
  const m = curMonth();
  const mf = S.fahrten.filter(e=>monthOf(e.date)===m);
  const ma = S.ausgaben.filter(e=>monthOf(e.date)===m);
  const mz = S.zeiten.filter(e=>monthOf(e.date)===m);
  const kmTotal = mf.reduce((s,e)=>s+(e.km||0),0);
  const ausgTotal = ma.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const stunden = mz.reduce((s,e)=>s+calcZeit(e),0);
  const clockedIn = !!S.zeiten.slice().reverse().find(e=>e.driver===S.activeUser&&!e.end);
  const pg = document.getElementById('page-dashboard');
  if(!pg) return;

  let html = '<div style="padding-bottom:12px;color:var(--muted);font-size:12px">Monat: <strong style="color:var(--text)">'+monthLabel(m)+'</strong></div>';
  html += '<div class="g4" style="margin-bottom:14px">';
  html += '<div class="kpi" style="border-left:4px solid var(--green)"><div class="k-label">Fahrten</div><div class="k-val" style="color:var(--greenM)">'+mf.length+'</div><div class="k-sub">'+fmtKm(kmTotal)+'</div></div>';
  html += '<div class="kpi" style="border-left:4px solid var(--blue)"><div class="k-label">Ausgaben</div><div class="k-val" style="color:var(--blue)">'+ma.length+'</div><div class="k-sub">'+fmtEur(ausgTotal)+'</div></div>';
  html += '<div class="kpi" style="border-left:4px solid var(--amber)"><div class="k-label">Arbeitsstunden</div><div class="k-val" style="color:var(--amber)">'+fmtH(stunden)+'</div><div class="k-sub">'+mz.length+' Einträge</div></div>';
  html += '<div class="kpi" style="border-left:4px solid '+(clockedIn?'var(--greenM)':'var(--muted)')+'"><div class="k-label">Status</div><div class="k-val" style="font-size:14px;color:'+(clockedIn?'var(--greenM)':'var(--muted)')+'">'+(clockedIn?'🟢 Eingestempelt':'⚪ Ausgestempelt')+'</div><div class="k-sub">'+esc(S.activeUser||'–')+'</div></div></div>';

  html += '<div class="card" style="margin-bottom:12px"><div class="card-title">Schnellzugriff</div><div class="g4">';
  html += '<button class="btn btn-green" onclick="openFahrtModal()">🚗 Fahrt eintragen</button>';
  html += '<button class="btn btn-blue" onclick="openAusgabeModal()">💸 Ausgabe eintragen</button>';
  html += '<button class="btn btn-amber" onclick="clockedIn?stempelGehen():stempelKommen()">&#8987; '+(clockedIn?'Gehen stempeln':'Kommen stempeln')+'</button>';
  html += '<button class="btn btn-grey" onclick="openZeitModal()">📝 Zeit manuell</button></div></div>';

  html += '<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="card-title" style="margin-bottom:0">📋 Aktuelle Aufträge</div><button class="btn btn-green btn-sm" onclick="showPage(this.dataset.p)" data-p="auftraege">Alle →</button></div><div id="dash-auftraege-body"><div style="color:var(--muted);font-size:12px">Lädt…</div></div></div>';

  const fRows = S.fahrten.slice(0,5).map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.driver)+'</td><td><span class="badge b-green">'+esc(e.vehicle)+'</span></td><td>'+esc(e.from)+' → '+esc(e.to)+'</td><td style="color:var(--blue);font-weight:600">'+fmtKm(e.km)+'</td></tr>').join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Noch keine Fahrten</td></tr>';
  const aRows = S.ausgaben.slice(0,5).map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.driver)+'</td><td>'+esc(e.desc)+'</td><td style="color:var(--red);font-weight:600">'+fmtEur(e.amount)+'</td></tr>').join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Noch keine Ausgaben</td></tr>';

  html += '<div class="g2">';
  html += '<div class="card"><div class="card-title">Letzte Fahrten</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Datum</th><th>Fahrer</th><th>Fahrzeug</th><th>Von → Nach</th><th>km</th></tr></thead><tbody>'+fRows+'</tbody></table></div></div>';
  html += '<div class="card"><div class="card-title">Letzte Ausgaben</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Beschreibung</th><th>Betrag</th></tr></thead><tbody>'+aRows+'</tbody></table></div></div>';
  html += '</div>';

  pg.innerHTML = html;
  renderDashAuftraege();

function renderDashAuftraege() {
  const el = document.getElementById('dash-auftraege-body');
  if(!el) return;
  const list = (window._auftraege||[]).slice(0,4);
  el.innerHTML = '';
  if(!list.length) { el.innerHTML='<p style="color:var(--muted);font-size:12px">Noch keine Aufträge.</p>'; return; }
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px';
  list.forEach(a => {
    const card = document.createElement('div');
    card.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--s2)';
    const statusLbl = a.status==='offen'?'Offen':a.status==='in_bearbeitung'?'In Bearb.':'Fertig';
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px';
    hdr.innerHTML = '<span style="font-size:12px;font-weight:600">'+esc(a.auftragsnummer)+'</span><span class="status-badge status-'+a.status+'">'+statusLbl+'</span>';
    const info = document.createElement('div');
    info.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:6px';
    info.textContent = (a.typ==='reinigung'?'🧹':'🔍')+' '+(a.kundenname||'')+(a.objekt?' — '+a.objekt:'');
    const ki = document.createElement('div');
    if(a.bericht_intern) { ki.style.cssText='background:var(--greenL);border:1px solid var(--greenB);border-radius:6px;padding:4px 8px;font-size:10px;color:var(--greenM);margin-bottom:6px'; ki.textContent='🤖 KI-Analyse vorhanden'; }
    else { ki.style.cssText='background:var(--amberL);border:1px solid var(--amberB);border-radius:6px;padding:4px 8px;font-size:10px;color:var(--amber);margin-bottom:6px'; ki.textContent='⚠️ Noch keine KI-Analyse'; }
    const btns = document.createElement('div');
    btns.style.cssText='display:flex;gap:5px';
    const b1=document.createElement('button'); b1.className='btn btn-grey btn-xs'; b1.textContent='✏️ Öffnen'; b1.onclick=()=>{openAuftrag(a.id);showPage('auftraege');};
    const b2=document.createElement('button'); b2.className='btn btn-green btn-xs'; b2.textContent='📄 Bericht'; b2.onclick=()=>{currentAuftrag=a;auftragView='bericht';showPage('auftraege');renderAuftraege();};
    btns.appendChild(b1); btns.appendChild(b2);
    card.appendChild(hdr); card.appendChild(info); card.appendChild(ki); card.appendChild(btns);
    grid.appendChild(card);
  });
  el.appendChild(grid);
}

function buildFilterRow(months, selM, onM, drivers, selD, onD, vehicles, selV, onV, onReset) {
  const mOpts = '<option value="">Alle Monate</option>'+months.map(m=>'<option value="'+m+'"'+(selM===m?' selected':'')+'>'+monthLabel(m)+'</option>').join('');
  const dOpts = '<option value="">Alle</option>'+drivers.map(d=>'<option value="'+esc(d)+'"'+(selD===d?' selected':'')+'>'+esc(d)+'</option>').join('');
  let html = '<div class="filter-bar"><div class="field"><label>Monat</label><select onchange="'+onM+'">'+mOpts+'</select></div>';
  html += '<div class="field"><label>Mitarbeiter</label><select onchange="'+onD+'">'+dOpts+'</select></div>';
  if(vehicles && vehicles.length) {
    const vOpts = '<option value="">Alle</option>'+vehicles.map(v=>'<option value="'+esc(v)+'"'+(selV===v?' selected':'')+'>'+esc(v)+'</option>').join('');
    html += '<div class="field"><label>Fahrzeug</label><select onchange="'+onV+'">'+vOpts+'</select></div>';
  }
  html += '<div style="display:flex;align-items:flex-end"><button class="btn btn-grey btn-sm" onclick="'+onReset+'">× Reset</button></div></div>';
  return html;
}

function renderFahrtenbuch() {
  const months = getMonths(S.fahrten);
  const list = S.fahrten.filter(e=>{
    if(F.fMonth && monthOf(e.date)!==F.fMonth) return false;

    if(F.fVehicle && e.vehicle!==F.fVehicle) return false;
    return true;
  });
  const totKm = list.reduce((s,e)=>s+(e.km||0),0);
  const rows = list.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td><strong>'+esc(e.driver)+'</strong></td><td><span class="badge b-green">'+esc(e.vehicle)+'</span></td><td>'+esc(e.from)+'</td><td>'+esc(e.to)+'</td><td style="font-weight:700;color:var(--blue)">'+fmtKm(e.km)+'</td><td style="font-size:11px;color:var(--muted)">'+(e.kmStart?fmtKm(e.kmStart)+' → '+fmtKm(e.kmEnd):'–')+'</td><td><span class="badge b-blue">'+esc(e.cat)+'</span></td><td>'+esc(e.purpose||'')+'</td><td style="white-space:nowrap"><button class="btn btn-grey btn-xs" onclick="editFahrt(this.dataset.id)" data-id="'+e.id+'">✏️</button> <button class="btn btn-red btn-xs" onclick="deleteFahrt(this.dataset.id)" data-id="'+e.id+'">×</button></td></tr>').join('');

  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="font-size:16px;font-weight:700;color:var(--grey)">🚗 Fahrtenbuch</h2><div style="display:flex;gap:8px"><button class="btn btn-grey btn-sm" onclick="exportCSV(this.dataset.t)" data-t="fahrten">📊 CSV</button><button class="btn btn-green" onclick="openFahrtModal()">+ Fahrt eintragen</button></div></div>';
  html += buildFilterRow(months, F.fMonth, "F.fMonth=this.value;renderFahrtenbuch()", S.drivers, F.fDriver, "F.fDriver=this.value;renderFahrtenbuch()", S.vehicles, F.fVehicle, "F.fVehicle=this.value;renderFahrtenbuch()", "F.fMonth='';F.fDriver='';F.fVehicle='';renderFahrtenbuch()");
  html += '<div class="g4" style="margin-bottom:12px"><div class="kpi"><div class="k-label">Fahrten</div><div class="k-val" style="color:var(--greenM)">'+list.length+'</div></div><div class="kpi"><div class="k-label">km gesamt</div><div class="k-val" style="color:var(--blue)">'+fmtKm(totKm)+'</div></div><div class="kpi"><div class="k-label">Ø km/Fahrt</div><div class="k-val" style="color:var(--grey)">'+(list.length?fmtKm(totKm/list.length):'–')+'</div></div><div class="kpi"><div class="k-label">Fahrzeuge</div><div class="k-val" style="color:var(--amber)">'+new Set(list.map(e=>e.vehicle)).size+'</div></div></div>';
  html += '<div class="card">'+(list.length?'<div class="tbl-wrap"><table class="t"><thead><tr><th>Datum</th><th>Fahrer</th><th>Fahrzeug</th><th>Von</th><th>Nach</th><th>km</th><th>KM-Stand</th><th>Kategorie</th><th>Zweck</th><th></th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="5" style="text-align:right">Gesamt</td><td style="font-weight:700;color:var(--greenM)">'+fmtKm(totKm)+'</td><td colspan="4"></td></tr></tfoot></table></div>':'<div class="empty"><div class="ei">🚗</div><div>Noch keine Fahrten.<br><br><button class="btn btn-green" onclick="openFahrtModal()">Erste Fahrt eintragen</button></div></div>')+'</div>';
  document.getElementById('page-fahrtenbuch').innerHTML = html;
}

function renderAusgaben() {
  const months = getMonths(S.ausgaben);
  const list = S.ausgaben.filter(e=>{
    if(F.aMonth && monthOf(e.date)!==F.aMonth) return false;
    if(F.aDriver && e.driver!==F.aDriver) return false;
    return true;
  });
  const totAmt = list.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const byCat = {};
  list.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+(parseFloat(e.amount)||0);});
  const rows = list.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td><strong>'+esc(e.driver)+'</strong></td><td><span class="badge b-blue" style="font-size:10px">'+esc(e.cat)+'</span></td><td>'+esc(e.desc)+'</td><td style="font-weight:700;color:var(--red)">'+fmtEur(e.amount)+'</td><td><span class="badge b-grey">'+esc(e.pay)+'</span></td><td style="font-size:11px;color:var(--muted)">'+esc(e.beleg||'–')+'</td><td style="white-space:nowrap"><button class="btn btn-grey btn-xs" onclick="editAusgabe(this.dataset.id)" data-id="'+e.id+'">✏️</button> <button class="btn btn-red btn-xs" onclick="deleteAusgabe(this.dataset.id)" data-id="'+e.id+'">×</button></td></tr>').join('');
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>'<tr><td><span class="badge b-blue">'+esc(cat)+'</span></td><td style="text-align:right">'+list.filter(e=>e.cat===cat).length+'</td><td style="text-align:right;font-weight:600;color:var(--red)">'+fmtEur(amt)+'</td><td style="text-align:right">'+(totAmt>0?Math.round(amt/totAmt*100):0)+'%</td></tr>').join('');

  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="font-size:16px;font-weight:700;color:var(--grey)">💸 Ausgaben / Spesen</h2><div style="display:flex;gap:8px"><button class="btn btn-grey btn-sm" onclick="exportCSV(this.dataset.t)" data-t="ausgaben">📊 CSV</button><button class="btn btn-blue" onclick="openAusgabeModal()">+ Ausgabe eintragen</button></div></div>';
  html += buildFilterRow(months, F.aMonth, "F.aMonth=this.value;renderAusgaben()", S.drivers, F.aDriver, "F.aDriver=this.value;renderAusgaben()", null, '', '', "F.aMonth='';F.aDriver='';renderAusgaben()");
  html += '<div class="g2"><div class="card">'+(list.length?'<div class="tbl-wrap"><table class="t"><thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Kategorie</th><th>Beschreibung</th><th>Betrag</th><th>Zahlung</th><th>Beleg</th><th></th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="4" style="text-align:right">Gesamt</td><td style="color:var(--red);font-weight:700">'+fmtEur(totAmt)+'</td><td colspan="3"></td></tr></tfoot></table></div>':'<div class="empty"><div class="ei">💸</div><div>Noch keine Ausgaben.</div></div>')+'</div>';
  html += '<div class="card"><div class="card-title">Nach Kategorie</div>'+(catRows?'<div class="tbl-wrap"><table class="t"><thead><tr><th>Kategorie</th><th style="text-align:right">Anz.</th><th style="text-align:right">Gesamt</th><th style="text-align:right">%</th></tr></thead><tbody>'+catRows+'</tbody></table></div>':'<div class="empty" style="padding:20px">Keine Daten</div>')+'</div></div>';
  document.getElementById('page-ausgaben').innerHTML = html;
}

function renderArbeitszeit() {
  const months = getMonths(S.zeiten);
  const list = S.zeiten.filter(e=>{
    if(F.zMonth && monthOf(e.date)!==F.zMonth) return false;
    if(F.zDriver && e.driver!==F.zDriver) return false;
    return true;
  });
  const totH = list.reduce((s,e)=>s+calcZeit(e),0);
  const lastOpen = S.zeiten.slice().reverse().find(e=>e.driver===S.activeUser&&!e.end);
  const clockedIn = !!lastOpen;
  const rows = list.map(e=>{const h=calcZeit(e),open=!e.end;return '<tr style="'+(open?'background:#2D2A00':'')+'"><td>'+fmtDate(e.date)+'</td><td><strong>'+esc(e.driver)+'</strong></td><td style="font-family:monospace">'+esc(e.start||'–')+'</td><td>'+(open?'<span style="color:var(--amber)">läuft…</span>':esc(e.end||'–'))+'</td><td>'+(e.brk?e.brk+' Min':'–')+'</td><td style="font-weight:700;color:'+(h>=8?'var(--greenM)':h>=4?'var(--blue)':'var(--amber)')+'">'+(open?'–':fmtH(h))+'</td><td>'+esc(e.task||'')+'</td><td style="white-space:nowrap"><button class="btn btn-grey btn-xs" onclick="editZeit(this.dataset.id)" data-id="'+e.id+'">✏️</button> <button class="btn btn-red btn-xs" onclick="deleteZeit(this.dataset.id)" data-id="'+e.id+'">×</button></td></tr>';}).join('');
  const byDriverRows = S.drivers.map(d=>{const dL=list.filter(e=>e.driver===d);const dH=dL.reduce((s,e)=>s+calcZeit(e),0);return '<tr><td><strong>'+esc(d)+'</strong></td><td style="text-align:right">'+dL.length+'</td><td style="text-align:right;font-weight:600;color:var(--blue)">'+fmtH(dH)+'</td></tr>';}).join('');

  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="font-size:16px;font-weight:700;color:var(--grey)">&#8987; Arbeitszeiterfassung</h2><div style="display:flex;gap:8px"><button class="btn btn-grey btn-sm" onclick="exportCSV(this.dataset.t)" data-t="zeiten">📊 CSV</button><button class="btn btn-grey" onclick="openZeitModal()">📝 Manuell</button></div></div>';
  html += '<div class="stempel-card"><div class="stempel-time" id="live-clock">--:--:--</div><div style="font-size:13px;opacity:.8;margin-top:4px">'+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+'</div><div style="font-size:13px;margin-top:8px">'+(clockedIn?'🟢 Eingestempelt seit '+lastOpen.start:'⚪ Ausgestempelt')+'</div><div style="font-size:12px;opacity:.8;margin-top:4px">Nutzer: <strong>'+esc(S.activeUser||'– bitte wählen –')+'</strong></div><div class="stempel-btns"><button class="stempel-btn btn-kommen" onclick="stempelKommen()" '+(clockedIn?'disabled style="opacity:.4"':'')+'>&#8595; Kommen</button><button class="stempel-btn btn-gehen" onclick="stempelGehen()" '+(!clockedIn?'disabled style="opacity:.4"':'')+'>&#8593; Gehen</button></div></div>';
  html += buildFilterRow(months, F.zMonth, "F.zMonth=this.value;renderArbeitszeit()", S.drivers, F.zDriver, "F.zDriver=this.value;renderArbeitszeit()", null, '', '', "F.zMonth='';F.zDriver='';renderArbeitszeit()");
  html += '<div class="g4" style="margin-bottom:12px"><div class="kpi"><div class="k-label">Einträge</div><div class="k-val" style="color:var(--amber)">'+list.length+'</div></div><div class="kpi"><div class="k-label">Stunden gesamt</div><div class="k-val" style="color:var(--blue)">'+fmtH(totH)+'</div></div><div class="kpi"><div class="k-label">Ø Std/Tag</div><div class="k-val" style="color:var(--grey)">'+(list.length?fmtH(totH/list.length):'–')+'</div></div><div class="kpi"><div class="k-label">Mitarbeiter</div><div class="k-val" style="color:var(--greenM)">'+new Set(list.map(e=>e.driver)).size+'</div></div></div>';
  html += '<div class="g2"><div class="card">'+(list.length?'<div class="tbl-wrap"><table class="t"><thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Kommen</th><th>Gehen</th><th>Pause</th><th>Stunden</th><th>Tätigkeit</th><th></th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="5" style="text-align:right">Gesamt</td><td style="color:var(--greenM);font-weight:700">'+fmtH(totH)+'</td><td colspan="2"></td></tr></tfoot></table></div>':'<div class="empty"><div class="ei">&#8987;</div><div>Noch keine Zeiteinträge.</div></div>')+'</div><div class="card"><div class="card-title">Stunden nach Mitarbeiter</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Mitarbeiter</th><th style="text-align:right">Tage</th><th style="text-align:right">Stunden</th></tr></thead><tbody>'+byDriverRows+'</tbody></table></div></div></div>';
  document.getElementById('page-arbeitszeit').innerHTML = html;

  const tick=()=>{const el=document.getElementById('live-clock');if(el)el.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});};
  tick(); clearInterval(window._clockInterval); window._clockInterval=setInterval(tick,1000);
}

function openFahrtModal(id) {
  const dsel=document.getElementById('f-driver');
  if(dsel) dsel.innerHTML=S.drivers.map(d=>'<option value="'+esc(d)+'"'+(S.activeUser===d?' selected':'')+'>'+esc(d)+'</option>').join('');
  const vsel=document.getElementById('f-vehicle');
  if(vsel) vsel.innerHTML=S.vehicles.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  document.getElementById('fahrt-edit-id').value='';
  document.getElementById('fahrt-modal-title').textContent='🚗 Fahrt eintragen';
  document.getElementById('f-date').value=today();
  ['f-km-s','f-km-e','f-km','f-from','f-to','f-purpose'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  document.getElementById('f-cat').value='Geschäftlich';
  if(id) {
    const e=S.fahrten.find(x=>x.id===id);
    if(e) {
      document.getElementById('fahrt-modal-title').textContent='🚗 Fahrt bearbeiten';
      document.getElementById('fahrt-edit-id').value=e.id;
      document.getElementById('f-date').value=e.date||'';
      document.getElementById('f-driver').value=e.driver||'';
      document.getElementById('f-vehicle').value=e.vehicle||'';
      document.getElementById('f-km-s').value=e.kmStart||'';
      document.getElementById('f-km-e').value=e.kmEnd||'';

async function stempelGehen() {
  if(!S.activeUser){alert('Bitte Nutzer wählen.');return;}
  const entry=S.zeiten.slice().reverse().find(e=>e.driver===S.activeUser&&!e.end);
  if(!entry){alert('Du bist nicht eingestempelt.');return;}
  const brk=prompt('Pause in Minuten (0 wenn keine):','30');
  const t=nowTime();
  await supaFetch('arbeitszeiten','PATCH',{gehen:t,pause_min:parseInt(brk)||0},'?id=eq.'+entry.id);
  await loadAll();
  if(entry.start){const [sh,sm]=entry.start.split(':').map(Number),[eh,em]=t.split(':').map(Number);const mins=Math.max(0,(eh*60+em)-(sh*60+sm)-(parseInt(brk)||0));try{await fetch(SUPA_URL+'/functions/v1/stempel-notify',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},body:JSON.stringify({typ:'gehen',fahrer:S.activeUser,zeit:t,datum:new Date().toLocaleDateString('de-DE'),stunden:Math.floor(mins/60)+'h '+mins%60+'m'})});}catch(e){}}
}

async function autoGeocode() {
  const a=document.getElementById('af-adresse')?.value.trim();
  if(!a||a.length<5)return;
  const s=document.getElementById('gps-status');if(s)s.textContent='⏳ suche…';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(a)+'&limit=1',{headers:{'Accept-Language':'de','User-Agent':'DroneX360/1.0'}});
    const data=await r.json();
    if(data&&data[0]){const g=document.getElementById('af-gps');if(g)g.value=parseFloat(data[0].lat).toFixed(6)+', '+parseFloat(data[0].lon).toFixed(6);if(s){s.textContent='✓ gefunden';setTimeout(()=>{if(s)s.textContent='';},3000);}}
    else if(s){s.textContent='✗ nicht gefunden';setTimeout(()=>{if(s)s.textContent='';},3000);}
  }catch(e){if(s){s.textContent='✗ Fehler';setTimeout(()=>{if(s)s.textContent='';},2000);}}
}

async function uploadFotos(auftragId,phase,input) {
  const files=Array.from(input.files);
  for(const file of files){
    await new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=async e=>{await supaFetch('auftrag_fotos','POST',{id:uid(),auftrag_id:auftragId,phase,beschriftung:phase==='vorher'?'Vorher':phase==='nachher'?'Nachher':'Befund',bild_base64:e.target.result,ki_analyse:''});resolve();};
      reader.readAsDataURL(file);
    });
  }
  input.value='';await openAuftrag(auftragId);
}

async function kiAnalyse(auftragId,btn) {
  const key=getAnthropicKey();
  if(!key){alert('Bitte Anthropic API-Key eintragen.');return;}
  await loadFotos(auftragId);
  const a=currentAuftrag;
  if(btn){btn.textContent='🤖 Analysiere…';btn.disabled=true;}
  try{
    const vorher=auftragFotos.filter(f=>f.phase==='vorher');
    const nachher=auftragFotos.filter(f=>f.phase==='nachher');
    const befund=auftragFotos.filter(f=>f.phase==='befund');
    const intro = 'Du bist ein professioneller Drohnen-'+(a.typ==='reinigung'?'Reinigungsexperte':'Inspekteur')+' bei DroneX360 UG. Objekt: '+(a.objekt||'')+' Kunde: '+(a.kundenname||'')+' Befunde: '+(a.befunde||'keine');
    const parts=[{type:'text',text:intro}];
    const addF=(fotos,lbl)=>{if(fotos.length>0){parts.push({type:'text',text:lbl});fotos.slice(0,3).forEach(f=>{if(f.bild_base64&&f.bild_base64.includes('base64,')){const b64=f.bild_base64.split('base64,')[1];parts.push({type:'image',source:{type:'base64',media_type:f.bild_base64.includes('png')?'image/png':'image/jpeg',data:b64}});}});}};
    addF(vorher,'--- VORHER-FOTOS ---');addF(befund,'--- BEFUND-FOTOS ---');addF(nachher,'--- NACHHER-FOTOS ---');
    const promptR='Erstelle eine professionelle Reinigungsanalyse:\n1. VERSCHMUTZUNGSGRAD VORHER (0-100%)\n2. SAUBERKEITSGRAD NACHHER (0-100%)\n3. VERBESSERUNG in Prozentpunkten\n4. ERKANNTE VERSCHMUTZUNGEN\n5. REINIGUNGSERGEBNIS\n6. EMPFEHLUNGEN\n7. FAZIT';
const promptI='Erstelle eine professionelle Inspektionsanalyse:\n1. BEFUND\u00dcBERSICHT\n2. SCHWEREGRADBEWERTUNG (Kritisch/Mittel/Gering)\n3. VERSCHMUTZUNGSGRAD (0-100%)\n4. EMPFOHLENE MASSNAHMEN\n5. FAZIT';
parts.push({type:'text',text:a.typ==='reinigung'?promptR:promptI});
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:parts}]})});
    const data=await r.json();
    const reply=data.content?.find(b=>b.type==='text')?.text||'';
    await supaFetch('auftraege','PATCH',{bericht_intern:reply},'?id=eq.'+auftragId);
    currentAuftrag={...currentAuftrag,bericht_intern:reply};
    await renderAuftraege();
  }catch(e){alert('KI-Fehler: '+e.message);}
  if(btn){btn.textContent='🤖 KI-Analyse';btn.disabled=false;}
}

async function processAiInput(text) {
  if(!text.trim()||aiLoading)return;
  const key=getAnthropicKey();
  if(!key){aiMsgs.push({role:'bot',content:'Bitte zuerst API-Key oben eingeben.'});renderAssistent();return;}
  aiMsgs.push({role:'user',content:text});aiLoading=true;renderAssistent();
  const system='Du bist ein interner Assistent fuer DroneX360 UG. Mitarbeiter: '+S.drivers.join(', ')+'. Fahrzeuge: '+S.vehicles.join(', ')+'. Nutzer: '+(S.activeUser||'')+'. Heute: '+new Date().toLocaleDateString('de-DE')+'. Wenn der Nutzer eine Fahrt, Ausgabe oder Arbeitszeit beschreibt, antworte NUR mit JSON: {"typ":"fahrt","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","fahrzeug":"KFZ","von":"Ort","nach":"Ort","km":0,"kategorie":"Geschaeftlich","zweck":""},"bestaetigung":"..."} Fuer allgemeine Fragen antworte normal auf Deutsch.';
  const msgs=aiMsgs.filter(m=>m.role==='user'||m.content!=='confirmed').map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));
  try{
    const reply=await callClaude(msgs,system);
    const match=reply.match(/\{[\s\S]*"typ"[\s\S]*\}/);
    if(match){const parsed=JSON.parse(match[0]);await applyAiEntry(parsed);aiMsgs.push({role:'bot',content:'confirmed',data:parsed});}
    else aiMsgs.push({role:'bot',content:reply});
  }catch(e){aiMsgs.push({role:'bot',content:'Fehler: '+e.message});}
  aiLoading=false;renderAssistent();
  setTimeout(()=>{const el=document.getElementById('ai-chat-msgs');if(el)el.scrollTop=el.scrollHeight;},100);
}

async function applyAiEntry(p) {
  const d=p.daten||{},date=d.datum||today(),driver=d.fahrer||S.activeUser||S.drivers[0];
  if(p.typ==='fahrt')await supaFetch('fahrten','POST',{id:uid(),datum:date,fahrer:driver,fahrzeug:d.fahrzeug||'',von:d.von||'',nach:d.nach||'',km:parseFloat(d.km)||0,km_start:0,km_end:0,kategorie:d.kategorie||'Geschaeftlich',zweck:d.zweck||''});
  else if(p.typ==='ausgabe')await supaFetch('ausgaben','POST',{id:uid(),datum:date,fahrer:driver,betrag:parseFloat(d.betrag)||0,zahlungsart:d.zahlungsart||'Bar',kategorie:d.kategorie||'Sonstiges',beschreibung:d.beschreibung||'',beleg:d.beleg||'',notiz:''});
  else if(p.typ==='arbeitszeit')await supaFetch('arbeitszeiten','POST',{id:uid(),datum:date,fahrer:driver,kommen:d.start||'',gehen:d.end||'',pause_min:parseInt(d.brk)||0,taetigkeit:d.task||'',notiz:''});
  await loadAll();
}

function startMic() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Spracheingabe nur in Chrome.');return;}
  if(aiListening){aiRecognition?.stop();aiListening=false;renderAssistent();return;}
  aiRecognition=new SR();aiRecognition.lang='de-DE';aiRecognition.continuous=false;aiRecognition.interimResults=false;
  aiRecognition.onresult=e=>{const txt=e.results[0][0].transcript;const inp=document.getElementById('ai-text');if(inp)inp.value=txt;aiListening=false;renderAssistent();processAiInput(txt);};
  aiRecognition.onerror=aiRecognition.onend=()=>{aiListening=false;renderAssistent();};
  aiRecognition.start();aiListening=true;renderAssistent();
}

  +'<div class="ai-key-bar"><span style="color:#90CAF9;font-weight:600">🔑 API-Key:</span><input type="password" id="ai-key-inp" placeholder="sk-ant-..." value="'+(hasKey?'loaded':'')+'"/><button class="btn btn-blue btn-sm" onclick="var k=document.getElementById(&quot;ai-key-inp&quot;).value;if(k&&k!==&quot;loaded&quot;)setAnthropicKey(k);renderAssistent();">Speichern</button>'+(hasKey?'<span style="color:var(--greenM);font-weight:600">✓ Verbunden</span>':'<span style="color:#EF5350;font-weight:600">⚠ Nicht verbunden</span>')+'</div>'
  +'<div class="ai-quick-btns">'+quicks.map(q=>'<button class="ai-quick" onclick="sendAiQuick(this.dataset.q)" data-q="+q+">'+q+'</button>').join('')+'</div>'
  +'<div id="ai-chat-msgs">'+msgHtml+(aiLoading?'<div class="ai-msg bot"><div class="ai-avatar" style="background:var(--greenM)">KI</div><div class="ai-bubble" style="color:var(--muted)">Verarbeite…</div></div>':'')+'</div>'
  +'<div class="ai-input-row"><textarea id="ai-text" placeholder="z.B. Heute von Offenburg nach Freiburg, 68 km mit OG X553"></textarea><button class="mic-btn '+(aiListening?'recording':'')+'" onclick="startMic()">'+(aiListening?'🔴':'🎤')+'</button><button class="btn btn-green" onclick="sendAiMsg()" style="height:44px;padding:0 16px">'+(aiLoading?'…':'Senden')+'</button></div>'

function renderBuchhaltung() {
  const pg=document.getElementById('page-buchhaltung');if(!pg)return;
  if(!currentProfile||currentProfile.rolle!=='admin'){pg.innerHTML='<div class="empty"><div class="ei">🔒</div><div>Kein Zugriff — nur für Admins</div></div>';return;}
  const existing=document.getElementById('buch-iframe');
  if(existing){existing.style.display='block';pg.style.padding='0';return;}
  pg.style.padding='0';pg.innerHTML='';
  const iframe=document.createElement('iframe');
  iframe.id='buch-iframe';
  iframe.style.cssText='width:100%;height:calc(100vh - 100px);border:none;display:block';
  try {
    const decoded = decodeURIComponent(escape(atob(BUCH_B64)));
    iframe.srcdoc = decoded;
  } catch(e) {
    const bytes = Uint8Array.from(atob(BUCH_B64), c=>c.charCodeAt(0));
    const blob = new Blob([bytes],{type:'text/html;charset=utf-8'});
    iframe.src = URL.createObjectURL(blob);
  }
  iframe.onload=()=>{const key=localStorage.getItem('dx_ant_key')||'';if(key)iframe.contentWindow.postMessage({type:'SET_KEY',key},'*');};
  pg.appendChild(iframe);
}

function renderSettings() {
  const pg=document.getElementById('page-settings');if(!pg)return;
  let html='<h2 style="font-size:16px;font-weight:700;color:var(--grey);margin-bottom:16px">⚙️ Einstellungen</h2><div class="g2">';
  html+='<div class="card"><div class="card-title">👤 Aktiver Nutzer</div><div class="field" style="margin-bottom:12px"><label>Wer bist du?</label><select onchange="S.activeUser=this.value;document.getElementById(&quot;active-user-label&quot;).textContent=this.value||&quot;Nutzer wählen&quot;;renderSettings()"><option value="">– Nutzer wählen –</option>'+S.drivers.map(d=>'<option value="'+esc(d)+'"'+(S.activeUser===d?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div><div style="font-size:11px;color:var(--muted)">Wird beim Stempeln verwendet.</div></div>';
  html+='<div class="card"><div class="card-title">🚗 Fahrzeuge</div><div style="margin-bottom:10px">'+S.vehicles.map(v=>'<span class="chip" style="background:var(--greenL);border:1px solid var(--greenB);color:var(--greenM)">'+esc(v)+'<button onclick="removeVehicle(this.dataset.v)" data-v="+esc(v)+">×</button></span>').join('')+'</div><div style="display:flex;gap:8px"><input type="text" id="new-veh" placeholder="Kennzeichen…" style="flex:1;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;outline:none;background:var(--s2);color:var(--text)" onkeydown="if(event.keyCode===13)addVehicle()"/><button class="btn btn-green btn-sm" onclick="addVehicle()">+ Hinzufügen</button></div></div>';
  html+='<div class="card"><div class="card-title">👥 Mitarbeiter</div><div style="margin-bottom:10px">'+S.drivers.map(d=>'<span class="chip" style="background:var(--blueL);border:1px solid var(--blueB);color:var(--blue)">'+esc(d)+'<button onclick="removeDriver(this.dataset.d)" data-d="+esc(d)+">×</button></span>').join('')+'</div><div style="display:flex;gap:8px"><input type="text" id="new-drv" placeholder="Name…" style="flex:1;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;outline:none;background:var(--s2);color:var(--text)" onkeydown="if(event.keyCode===13)addDriver()"/><button class="btn btn-blue btn-sm" onclick="addDriver()">+ Hinzufügen</button></div></div>';
  html+='</div>';
  pg.innerHTML=html;
}

function addDriver(){const v=document.getElementById('new-drv')?.value.trim();if(v){const d=S.drivers;if(!d.includes(v)){d.push(v);S.drivers=d;}renderSettings();document.getElementById('new-drv').value='';}}
function removeDriver(d){if(confirm('"'+d+'" entfernen?')){S.drivers=S.drivers.filter(x=>x!==d);renderSettings();}}
function addVehicle(){const v=document.getElementById('new-veh')?.value.trim().toUpperCase();if(v){const veh=S.vehicles;if(!veh.includes(v)){veh.push(v);S.vehicles=veh;}renderSettings();document.getElementById('new-veh').value='';}}
function removeVehicle(v){if(confirm('"'+v+'" entfernen?')){S.vehicles=S.vehicles.filter(x=>x!==v);renderSettings();}}

function closeModal(id){document.getElementById(id)?.classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');}));

function exportCSV(type) {
  let rows,header,name;
  if(type==='fahrten'){header=['Datum','Fahrer','Fahrzeug','Von','Nach','km','KM-Start','KM-Ende','Kategorie','Zweck'];rows=S.fahrten.map(e=>[fmtDate(e.date),e.driver,e.vehicle,e.from,e.to,e.km||0,e.kmStart||'',e.kmEnd||'',e.cat,e.purpose||'']);name='Fahrtenbuch';}
  else if(type==='ausgaben'){header=['Datum','Mitarbeiter','Betrag','Zahlungsart','Kategorie','Beschreibung','Beleg'];rows=S.ausgaben.map(e=>[fmtDate(e.date),e.driver,e.amount||0,e.pay,e.cat,e.desc,e.beleg||'']);name='Ausgaben';}
  else{header=['Datum','Mitarbeiter','Kommen','Gehen','Pause','Stunden','Tätigkeit'];rows=S.zeiten.map(e=>[fmtDate(e.date),e.driver,e.start||'',e.end||'',e.brk||0,fmtH(calcZeit(e)),e.task||'']);name='Arbeitszeit';}
  const csv = '\uFEFF' + [header,...rows].map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(';');}).join('\n');

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='DroneX360_'+name+'_'+today()+'.csv';a.click();
}
