<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DroneX360 – Internes System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D6A3E;--greenL:#0D2E18;--greenM:#4CAF82;--greenB:#2D6B4F;
  --blue:#1976D2;--blueL:#0A1929;--blueB:#1E3A5F;
  --red:#EF5350;--redL:#2D0A0A;--redB:#5C1A1A;
  --orange:#FF7043;--orangeL:#2D1A0A;--orangeB:#7A3520;
  --amber:#FFB300;--amberL:#2D2000;--amberB:#7A5500;
  --purple:#9C27B0;--purpleL:#1A0A2D;--purpleB:#4A1B7A;
  --grey:#90A4AE;--greyL:#1A1A1A;--greyM:#78909C;
  --border:#2D2D2D;--text:#E0E0E0;--muted:#9E9E9E;
  --navy:#1565C0;
}
body{font-family:Arial,sans-serif;background:#0D0D0D;color:var(--text);font-size:13px;min-height:100vh}
*{font-family:Arial,sans-serif}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── APP SHELL ── */
.app-header{background:#000;color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:300;box-shadow:0 1px 0 #2D2D2D}
.app-header .logo{font-size:15px;font-weight:700;letter-spacing:.02em}
.app-header .logo span{opacity:.7;font-weight:400;font-size:12px;margin-left:6px}
.header-right{display:flex;align-items:center;gap:10px}
.user-pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px}

/* ── NAV ── */
.main-nav{background:#1E1E1E;border-bottom:2px solid var(--border);display:flex;gap:0;overflow-x:auto;position:sticky;top:52px;z-index:200}
.nav-btn{padding:12px 20px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
.nav-btn:hover{color:#fff;background:#2A2A2A}
.nav-btn.active{color:#4CAF82;border-bottom-color:#4CAF82;font-weight:600}
.nav-btn .nav-icon{margin-right:5px}

/* ── LAYOUT ── */
.page{display:none;padding:16px;max-width:1100px;margin:0 auto}
.page.active{display:block}

/* ── CARDS ── */
.card{background:#1E1E1E;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:12px;font-weight:700;color:var(--grey);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-header{color:#fff;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:600;margin:12px 0 0;display:flex;align-items:center;justify-content:space-between}

/* ── GRID HELPERS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.g-auto{grid-template-columns:1fr 1fr}}

/* ── FORM ── */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;background:#1E1E1E;color:var(--text);outline:none;font-size:13px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,106,62,.1)}
.field textarea{resize:vertical;min-height:64px}
.required::after{content:" *";color:var(--red)}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-grey{background:#2A2A2A;color:#B0B0B0;border:1px solid #3A3A3A}
.btn-red{background:var(--redL);color:var(--red);border:1px solid var(--redB)}
.btn-amber{background:var(--amberL);color:var(--amber);border:1px solid var(--amberB)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 8px;font-size:10px}

/* ── KPI ── */
.kpi{background:#1E1E1E;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kpi .k-label{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
.kpi .k-val{font-size:22px;font-weight:600;line-height:1.2}
.kpi .k-sub{font-size:10px;color:var(--muted);margin-top:3px}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:var(--green);color:#fff;padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr:nth-child(even) td{background:#1A1A1A}
table.t tr:hover td{background:#0D2E18}
table.t tfoot td{background:#0D2E18;font-weight:700;color:var(--greenM)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap}
.b-green{background:var(--greenL);color:var(--greenM)}
.b-blue{background:var(--blueL);color:var(--blue)}
.b-amber{background:var(--amberL);color:var(--amber)}
.b-red{background:var(--redL);color:var(--red)}
.b-purple{background:var(--purpleL);color:var(--purple)}
.b-grey{background:var(--greyL);color:var(--grey)}
.b-orange{background:var(--orangeL);color:var(--orange)}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:12px}
.modal-bg.open{display:flex}
.modal{background:#1E1E1E;border-radius:12px;padding:0;width:560px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 12px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;color:var(--grey);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1E1E1E;z-index:1}
.modal-head button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#1E1E1E}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding:10px 12px;background:#1E1E1E;border:1px solid var(--border);border-radius:8px}
.filter-bar .field{min-width:120px;flex:1}
.filter-bar label{font-size:10px}

/* ── STEMPEL ── */
.stempel-card{background:linear-gradient(135deg,var(--green),#2E7D32);color:#fff;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.stempel-time{font-size:42px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stempel-date{font-size:13px;opacity:.8;margin-top:4px}
.stempel-status{margin:12px 0;font-size:13px;font-weight:500;padding:6px 16px;border-radius:20px;display:inline-block}
.status-in{background:#1E1E1E;color:var(--greenM)}
.status-out{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.stempel-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.stempel-btn{padding:10px 24px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-kommen{background:#1E1E1E;color:var(--greenM)}
.btn-gehen{background:var(--redL);color:var(--red)}

/* ── CHIP LIST ── */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:16px;padding:4px 10px;font-size:11px;font-weight:500;margin:2px}
.chip button{background:none;border:none;cursor:pointer;font-size:13px;line-height:1;padding:0}

/* ── SETTINGS PAGE ── */
.settings-section{margin-bottom:20px}
.settings-section h3{font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{font-size:36px;margin-bottom:8px}


/* KI ASSISTENT */
#ai-chat-msgs{height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#0A0A0A;padding:12px;margin-bottom:10px}
.ai-msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.ai-msg.user{flex-direction:row-reverse}
.ai-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.ai-bubble{max-width:80%;border-radius:10px;padding:9px 13px;font-size:12px;line-height:1.6;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.ai-msg.user .ai-bubble{background:#0A2A1A;border-color:var(--greenB);color:#E0E0E0}
.ai-msg.bot .ai-bubble{background:#1A1A1A;border-color:var(--border);color:#E0E0E0}
.ai-key-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0A1929;border:1px solid var(--blueB);border-radius:8px;margin-bottom:10px;font-size:11px;flex-wrap:wrap}
.ai-key-bar input{flex:1;border:1px solid var(--blueB);border-radius:6px;padding:4px 8px;background:#0D0D0D;color:#90CAF9;font-size:11px;outline:none;font-family:monospace;min-width:120px}
.ai-input-row{display:flex;gap:8px;align-items:flex-end}
#ai-text{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;resize:none;min-height:50px;max-height:120px;background:#1A1A1A;color:var(--text);outline:none;font-family:Arial,sans-serif}
#ai-text:focus{border-color:var(--greenM)}
.mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1A1A1A;flex-shrink:0;transition:all .2s}
.mic-btn.recording{background:#C62828;border-color:#C62828;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ai-quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-quick{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#1A1A1A;color:var(--muted);font-size:11px;cursor:pointer}
.ai-quick:hover{background:var(--greenL);color:var(--greenM);border-color:var(--greenB)}
.cc-card{background:#0D2E18;border:1px solid var(--greenB);border-radius:8px;padding:10px 14px;margin-top:4px}
.cc-card .cc-title{color:var(--greenM);font-weight:600;margin-bottom:6px;font-size:13px}
.cc-card .cc-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--muted)}
.cc-card .cc-row span:last-child{color:var(--text);font-weight:500}


/* LOGIN */
#login-screen{position:fixed;inset:0;background:#0D0D0D;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:420px;background:#1A1A1A;border:1px solid #2D2D2D;border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:44px;width:auto}
.login-logo .login-sub{font-size:12px;color:#666;margin-top:6px}
.login-title{font-size:18px;font-weight:600;color:#E0E0E0;margin-bottom:4px;text-align:center}
.login-desc{font-size:12px;color:#666;text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;color:#9E9E9E;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.login-field input{width:100%;border:1.5px solid #2D2D2D;border-radius:8px;padding:10px 12px;background:#252525;color:#E0E0E0;font-size:13px;outline:none;font-family:Arial,sans-serif;transition:border-color .15s}
.login-field input:focus{border-color:#4CAF82}
.login-btn{width:100%;padding:11px;background:#1D6A3E;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s}
.login-btn:hover{background:#2E7D32}
.login-btn:disabled{background:#333;color:#666;cursor:not-allowed}
.login-error{background:#2D0A0A;border:1px solid #5C1A1A;color:#EF5350;border-radius:6px;padding:8px 12px;font-size:12px;margin-top:10px;display:none}
.login-forgot{text-align:center;margin-top:12px;font-size:12px;color:#666}
.login-forgot a{color:#4CAF82;cursor:pointer;text-decoration:none}
.login-forgot a:hover{text-decoration:underline}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer}
.user-badge .role-dot{width:7px;height:7px;border-radius:50%}


/* AUFTRAEGE */
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600}
.status-offen{background:#FFF8E1;color:#E65100;border:1px solid #FFE082}
.status-in_bearbeitung{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.status-abgeschlossen{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.typ-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600}
.typ-reinigung{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
.typ-inspektion{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.foto-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-1)}
.foto-card img{width:100%;height:100px;object-fit:cover;display:block}
.foto-card .foto-lbl{padding:5px 8px;font-size:10px;color:var(--text-secondary)}
.foto-upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;color:var(--text-muted);font-size:12px;transition:all .15s;margin-top:8px}
.foto-upload-zone:hover{border-color:var(--greenM);color:var(--greenM);background:var(--greenL)}
.befund-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--surface-1)}
.befund-card .bc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.schwere-1{color:#2E7D32;font-size:11px;font-weight:600}
.schwere-2{color:#E65100;font-size:11px;font-weight:600}
.schwere-3{color:#C62828;font-size:11px;font-weight:600}
.auftrag-detail{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.ad-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ad-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ad-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin-bottom:8px}
.ki-result{background:#0A1929;border:1px solid var(--blueB);border-radius:8px;padding:12px;font-size:12px;color:#90CAF9;line-height:1.7;margin-top:8px;white-space:pre-wrap}
.pdf-preview{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;color:#212121;font-family:Arial,sans-serif;font-size:12px;line-height:1.6}
.pdf-preview h1{font-size:18px;color:#1D6A3E;border-bottom:2px solid #1D6A3E;padding-bottom:8px;margin-bottom:14px}
.pdf-preview h2{font-size:14px;color:#37474F;margin:12px 0 6px}
.pdf-preview table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
.pdf-preview table td{padding:5px 8px;border:1px solid #e0e0e0}
.pdf-preview table tr:nth-child(even) td{background:#f5f5f5}

/* PRINT */
@media print{
  /* Hide everything by default */
  body > *{display:none!important}
  /* Show only pdf-content when printing */
  #pdf-content{display:block!important}
  #pdf-content *{display:revert!important}
  /* Reset body */
  body{background:#fff!important;margin:0!important;padding:0!important}
  /* Make pdf-content full page */
  #pdf-content{
    position:fixed!important;
    top:0!important;left:0!important;right:0!important;
    width:100%!important;
    padding:20px!important;
    background:#fff!important;
    color:#212121!important;
    font-family:Arial,sans-serif!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
  /* Keep table colors */
  table.t th, .pdf-preview table tr:nth-child(even) td{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
  /* Images show correctly */
  img{max-width:100%!important;display:block!important}
}
</style>
</head>
<body>

<!-- MODALS -->
<!-- Fahrt Modal -->
<div class="modal-bg" id="m-fahrt">
  <div class="modal">
    <div class="modal-head"><span id="fahrt-modal-title">🚗 Fahrt eintragen</span><button onclick="closeModal('m-fahrt')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="fahrt-edit-id"/>
      <div class="g2">
        <div class="field"><label class="required">Datum</label><input type="date" id="f-date"/></div>
        <div class="field"><label class="required">Fahrer</label><select id="f-driver"></select></div>
      </div>
      <div class="g3">
        <div class="field"><label class="required">Fahrzeug</label><select id="f-vehicle"></select></div>
        <div class="field"><label>KM-Stand Start</label><input type="number" id="f-km-s" placeholder="z.B. 12500" min="0"/></div>
        <div class="field"><label>KM-Stand Ende</label><input type="number" id="f-km-e" placeholder="z.B. 12680" min="0"/></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Von</label><input type="text" id="f-from" placeholder="Abfahrtsort"/></div>
        <div class="field"><label class="required">Nach</label><input type="text" id="f-to" placeholder="Zielort"/></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Kategorie</label>
          <select id="f-cat">
            <option>Geschäftlich</option><option>Kundenbesuch</option><option>Lieferung</option>
            <option>Behörde / Amt</option><option>Werkstatt / Tanken</option>
            <option>Privat (dienstlich veranlasst)</option><option>Sonstiges</option>
          </select>
        </div>
        <div class="field"><label>Gefahrene km</label><input type="number" id="f-km" placeholder="auto" min="0" style="background:#fafafa"/></div>
      </div>
      <div class="field"><label>Zweck / Notiz</label><textarea id="f-purpose" placeholder="Reisezweck, Kundenname…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-grey" onclick="closeModal('m-fahrt')">Abbrechen</button>
      <button class="btn btn-green" onclick="saveFahrt()">💾 Speichern</button>
    </div>
  </div>
</div>

<!-- Ausgabe Modal -->
<div class="modal-bg" id="m-ausgabe">
  <div class="modal">
    <div class="modal-head"><span id="ausgabe-modal-title">💸 Ausgabe eintragen</span><button onclick="closeModal('m-ausgabe')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="a-edit-id"/>
      <div class="g2">
        <div class="field"><label class="required">Datum</label><input type="date" id="a-date"/></div>
        <div class="field"><label class="required">Mitarbeiter</label><select id="a-driver"></select></div>
      </div>
      <div class="g2">
        <div class="field"><label class="required">Betrag (€)</label><input type="number" id="a-amount" step="0.01" min="0" placeholder="0,00"/></div>
        <div class="field"><label class="required">Zahlungsart</label>
          <select id="a-pay">
            <option value="Bar">Bar</option><option value="Karte">Karte</option>

async function supaFetch(table, method, body, filter) {
  method = method || 'GET';
  filter = filter || '';
  const url = SUPA_URL + '/rest/v1/' + table + filter;
  const token = localStorage.getItem('dx_access_token') || SUPA_KEY;
  const headers = {};
  headers['apikey'] = SUPA_KEY;
  headers['Authorization'] = 'Bearer ' + token;
  headers['Content-Type'] = 'application/json';
  if(method === 'POST') headers['Prefer'] = 'return=representation';
  if(method === 'PATCH') headers['Prefer'] = 'return=representation';
  const opts = {method: method, headers: headers};
  if(body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(url, opts);
    if(method === 'DELETE') return [];
    const text = await r.text();
    if(!text) return [];
    const parsed = JSON.parse(text);
    return Array.isArray(parsed) ? parsed : [];
  } catch(err) {
    console.error('supaFetch error:', err);
    return [];
  }
}

async function loadAll() {
  showLoading(true);
  try {
    const [fahrten, ausgaben, zeiten] = await Promise.all([
      supaFetch('fahrten', 'GET', null, '?order=datum.desc'),
      supaFetch('ausgaben', 'GET', null, '?order=datum.desc'),
      supaFetch('arbeitszeiten', 'GET', null, '?order=datum.desc'),
    ]);
    S.fahrten  = Array.isArray(fahrten)  ? fahrten.map(r=>  ({id:r.id,date:r.datum,driver:r.fahrer,vehicle:r.fahrzeug,from:r.von,to:r.nach,km:r.km,kmStart:r.km_start,kmEnd:r.km_end,cat:r.kategorie,purpose:r.zweck}))  : [];
    await loadAuftraege();
    S.ausgaben = Array.isArray(ausgaben) ? ausgaben.map(r=> ({id:r.id,date:r.datum,driver:r.fahrer,amount:r.betrag,pay:r.zahlungsart,cat:r.kategorie,desc:r.beschreibung,beleg:r.beleg,note:r.notiz})) : [];
    S.zeiten   = Array.isArray(zeiten)   ? zeiten.map(r=>   ({id:r.id,date:r.datum,driver:r.fahrer,start:r.kommen,end:r.gehen,brk:r.pause_min,task:r.taetigkeit,note:r.notiz}))   : [];
  } catch(e) {
    console.error('Supabase Ladefehler:', e);
    S.fahrten=[]; S.ausgaben=[]; S.zeiten=[];
  } finally {
    showLoading(false);
    renderPage(currentPage);
    setTimeout(renderDashAuftraege, 100);
  }
}

function showLoading(on) {
  let el = document.getElementById('loading-bar');
  if(!el) { el=document.createElement('div'); el.id='loading-bar';
    el.style.cssText='position:fixed;top:52px;left:0;right:0;height:3px;background:linear-gradient(90deg,#4CAF82,#00BCD4);z-index:999;transition:opacity .3s';
    document.body.appendChild(el); }
  el.style.opacity = on?'1':'0';
}

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const nowTime = () => new Date().toTimeString().slice(0,5);
const fmtDate = s => s?new Date(s+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const fmtTime = s => s||'–';
const fmtEur = v => (parseFloat(v)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtKm = v => (parseFloat(v)||0).toLocaleString('de-DE',{maximumFractionDigits:0})+' km';
const fmtH = v => { const h=Math.floor(v); const m=Math.round((v-h)*60); return `${h}h ${m<10?'0':''}${m}m`; };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const monthOf = d => (d||'').slice(0,7);
const monthLabel = s => { if(!s) return ''; const [y,m]=s.split('-'); return new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'}); };
const curMonth = () => new Date().toISOString().slice(0,7);

function getMonths(arr){ return [...new Set(arr.map(e=>monthOf(e.date)).filter(Boolean))].sort().reverse(); }

function calcZeit(e){
  if(!e.start||!e.end) return 0;
  const [sh,sm]=e.start.split(':').map(Number);
  const [eh,em]=e.end.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm)-(parseInt(e.brk)||0);
  return Math.max(0,mins/60);
}

let currentPage = 'dashboard';
function showPage(p){
  currentPage = p;
  // Hide finance iframe when not on buchhaltung tab
  var fi = document.getElementById('finance-iframe');
  if(fi && p !== 'buchhaltung') fi.style.display = 'none';
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const nb = document.getElementById('nav-'+p);
  if(nb) nb.classList.add('active');
  renderPage(p);
}
function renderPage(p){
  if(p==='dashboard') renderDashboard();
  else if(p==='fahrtenbuch') renderFahrtenbuch();
  else if(p==='ausgaben') renderAusgaben();
  else if(p==='arbeitszeit') renderArbeitszeit();
  else if(p==='auftraege') renderAuftraege();
  else if(p==='buchhaltung') renderBuchhaltung();
  else if(p==='assistent') renderAssistent();
  else if(p==='settings') renderSettings();
}

function renderArbeitszeit(){
  const all = S.zeiten;
  const months = getMonths(all);
  let list = all.filter(e=>{
    if(F.zMonth&&monthOf(e.date)!==F.zMonth) return false;
    if(F.zDriver&&e.driver!==F.zDriver) return false;
    return true;
  }).sort((a,b)=>b.date?.localeCompare(a.date)||b.id?.localeCompare(a.id)||0);

  const totH = list.reduce((s,e)=>s+calcZeit(e),0);
  const byDriver = {};
  S.drivers.forEach(d=>{ byDriver[d]=list.filter(e=>e.driver===d).reduce((s,e)=>s+calcZeit(e),0); });

  // Check if active user is clocked in
  const lastOpen = [...S.zeiten].reverse().find(e=>e.driver===S.activeUser&&!e.end);
  const clockedIn = !!lastOpen;

  document.getElementById('page-arbeitszeit').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h2 style="font-size:16px;font-weight:700;color:var(--grey)">⏱ Arbeitszeiterfassung</h2>
    <div style="display:flex;gap:8px" class="no-print">
      <button class="btn btn-grey btn-sm" onclick="exportCSV('zeiten')">📊 CSV</button>
      <button class="btn btn-grey" onclick="openZeitModal()">📝 Manuell</button>
    </div>
  </div>

  <!-- STEMPEL CARD -->
  <div class="stempel-card no-print">
    <div class="stempel-time" id="live-clock"></div>
    <div class="stempel-date">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>
    <div><span class="stempel-status ${clockedIn?'status-in':'status-out'}">${clockedIn?'🟢 Eingestempelt seit '+lastOpen.start:'⚪ Ausgestempelt'}</span></div>
    <div style="font-size:12px;opacity:.8;margin-top:4px">Aktiver Nutzer: <strong>${S.activeUser||'– bitte wählen –'}</strong></div>
    <div class="stempel-btns">
      <button class="stempel-btn btn-kommen" onclick="stempelKommen()" ${clockedIn?'disabled style="opacity:.4;cursor:not-allowed"':''}>⬇ Kommen</button>
      <button class="stempel-btn btn-gehen" onclick="stempelGehen()" ${!clockedIn?'disabled style="opacity:.4;cursor:not-allowed"':''}>⬆ Gehen</button>
    </div>
  </div>

  <div class="filter-bar no-print">
    ${monthSel(months,F.zMonth,"F.zMonth=this.value;renderArbeitszeit()")}
    ${filterSel('',S.drivers,'Mitarbeiter',F.zDriver,"F.zDriver=this.value;renderArbeitszeit()")}
    <div style="display:flex;align-items:flex-end"><button class="btn btn-grey btn-sm" onclick="F.zMonth='';F.zDriver='';renderArbeitszeit()">✕ Reset</button></div>
  </div>

  <div class="g4" style="margin-bottom:12px">
    <div class="kpi"><div class="k-label">Einträge</div><div class="k-val" style="color:var(--amber)">${list.length}</div></div>
    <div class="kpi"><div class="k-label">Stunden gesamt</div><div class="k-val" style="color:var(--blue)">${fmtH(totH)}</div></div>
    <div class="kpi"><div class="k-label">∅ Std/Tag</div><div class="k-val" style="color:var(--grey)">${list.length?fmtH(totH/list.length):'–'}</div></div>
    <div class="kpi"><div class="k-label">Mitarbeiter</div><div class="k-val" style="color:var(--greenM)">${new Set(list.map(e=>e.driver)).size}</div></div>
  </div>

  <div class="g2">
    <div class="card">
      <div class="card-title">Zeiteinträge</div>
      ${list.length?`<div class="tbl-wrap"><table class="t">
        <thead><tr><th>Datum</th><th>Mitarbeiter</th><th>Kommen</th><th>Gehen</th><th>Pause</th><th>Stunden</th><th>Tätigkeit</th><th class="no-print"></th></tr></thead>
        <tbody>${list.map(e=>{
          const h=calcZeit(e);
          const open=!e.end;
          return `<tr style="${open?'background:#2D2A00;':''}" title="${open?'Noch eingestempelt':''}">
            <td style="white-space:nowrap">${fmtDate(e.date)}</td>
            <td><strong>${esc(e.driver)}</strong></td>
            <td style="font-family:monospace">${esc(e.start||'–')}</td>
            <td style="font-family:monospace">${open?'<span style="color:var(--amber)">läuft…</span>':esc(e.end||'–')}</td>
            <td>${e.brk?e.brk+' Min':'–'}</td>
            <td style="font-weight:700;color:${h>=8?'var(--greenM)':h>=4?'var(--blue)':'var(--amber)'}">${open?'–':fmtH(h)}</td>
            <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.task||'')}</td>
            <td class="no-print" style="white-space:nowrap">
              <button class="btn btn-grey btn-xs" onclick="editZeit('${e.id}')">✏️</button>
              <button class="btn btn-red btn-xs" onclick="deleteZeit('${e.id}')">×</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td colspan="5" style="text-align:right">Gesamt</td><td style="color:var(--greenM);font-weight:700">${fmtH(totH)}</td><td colspan="2"></td></tr></tfoot>
      </table></div>`
      :'<div class="empty"><div class="ei">⏱</div><div>Noch keine Zeiteinträge.</div></div>'}
    </div>
    <div class="card">
      <div class="card-title">Stunden nach Mitarbeiter</div>
      <div class="tbl-wrap"><table class="t">
        <thead><tr><th>Mitarbeiter</th><th style="text-align:right">Tage</th><th style="text-align:right">Stunden</th></tr></thead>
        <tbody>${S.drivers.map(d=>{
          const dList=list.filter(e=>e.driver===d);
          const dH=dList.reduce((s,e)=>s+calcZeit(e),0);
          return `<tr>
            <td><strong>${esc(d)}</strong></td>
            <td style="text-align:right">${dList.length}</td>
            <td style="text-align:right;font-weight:600;color:var(--blue)">${fmtH(dH)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
  </div>`;

  // Live clock
  function tick(){ const el=document.getElementById('live-clock'); if(el) el.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
  tick(); clearInterval(window._clockInterval); window._clockInterval=setInterval(tick,1000);
}

function showLogin(){
  const el=document.getElementById('login-screen');
  if(el){ el.style.display='flex'; }
  const em=document.getElementById('l-email'); if(em) em.value='';
  const pw=document.getElementById('l-pass'); if(pw) pw.value='';
}

function hideLogin(){
  const el=document.getElementById('login-screen');
  if(el) el.style.display='none';
}

async function checkSession(){
  const token = localStorage.getItem('dx_access_token');
  if(!token){ showLogin(); return; }
  try {
    const r = await fetch(SUPA_URL_AUTH+'/auth/v1/user',{
      headers:{'apikey':SUPA_KEY_AUTH,'Authorization':'Bearer '+token}
    });
    const data = await r.text();
    if(!data){ showLogin(); return; }
    const user = JSON.parse(data);
    if(user && user.id){
      await loadUserProfile(user.id);
      hideLogin();
      await loadAll();
      renderPage('dashboard');
    } else {
      showLogin();
    }
  } catch(e){
    console.error('Session check error:', e);
    showLogin();
  }
}

// Auto-refresh token every 50 minutes
async function refreshToken(){
  const refresh = localStorage.getItem('dx_refresh_token');
  if(!refresh) return;
  try {
    const r = await fetch(SUPA_URL_AUTH+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY_AUTH},
      body: JSON.stringify({refresh_token: refresh})
    });
    const d = await r.json();
    if(d.access_token){
      localStorage.setItem('dx_access_token', d.access_token);
      localStorage.setItem('dx_refresh_token', d.refresh_token);
    } else {
      showLogin();
    }
  } catch(e){ console.error('Token refresh error:', e); }
}
setInterval(refreshToken, 50 * 60 * 1000);

function renderBuchhaltung(){
  var pg = document.getElementById('page-buchhaltung');
  if(!pg) return;
  if(!currentProfile || currentProfile.rolle !== 'admin'){
    pg.innerHTML = '<div style="text-align:center;padding:40px;color:#666">🔒 Kein Zugriff</div>';
    return;
  }
  var existing = document.getElementById('buch-iframe');
  if(existing){ existing.style.display='block'; pg.style.padding='0'; return; }
  pg.style.padding='0';
  pg.innerHTML='';
  var iframe = document.createElement('iframe');
  iframe.id='buch-iframe';
  iframe.style.cssText='width:100%;height:calc(100vh - 100px);border:none;display:block';
  var decoded = atob(_buchB64);
  var blob = new Blob([decoded],{type:'text/html;charset=utf-8'});
  iframe.src = URL.createObjectURL(blob);
  iframe.onload = function(){
    var key = localStorage.getItem('dx_ant_key')||'';
    if(key) iframe.contentWindow.postMessage({type:'SET_KEY',key:key},'*');
  };
  pg.appendChild(iframe);
}

// AUFTRAEGE
// ══════════════════════════════════════════════════════
var auftraege = [];
var currentAuftrag = null;
var auftragFotos = [];
var auftragView = 'list';

async function loadAuftraege(){
  var data = await supaFetch('auftraege','GET',null,'?order=erstellt_am.desc');
  auftraege = Array.isArray(data) ? data : [];
  window._auftraege = auftraege;
}

async function loadFotos(auftragId){
  var data = await supaFetch('auftrag_fotos','GET',null,'?auftrag_id=eq.'+auftragId+'&order=erstellt_am.asc');
  auftragFotos = Array.isArray(data) ? data : [];
}

function genAuftragNr(){
  var d = new Date();
  return 'DX-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(Math.random()*900+100);
}

async function renderAuftraege(){
  await loadAuftraege();
  var pg = document.getElementById('page-auftraege');
  if(!pg) return;
  if(auftragView==='list'){ renderAuftragList(); return; }
  else if(auftragView==='neu'){ renderAuftragForm(); return; }
  else if(auftragView==='detail' && currentAuftrag){ await renderAuftragDetail(); return; }
  else if(auftragView==='bericht' && currentAuftrag) pg.innerHTML = await renderAuftragBericht();
}

function renderAuftragList(){
  var pg = document.getElementById('page-auftraege');
  if(!pg) return '';

  var stats = {
    offen: auftraege.filter(function(a){return a.status==='offen';}).length,
    in_bearbeitung: auftraege.filter(function(a){return a.status==='in_bearbeitung';}).length,
    abgeschlossen: auftraege.filter(function(a){return a.status==='abgeschlossen';}).length
  };

  // Build page using DOM
  pg.innerHTML = '';

  // Header
  var hdr = document.createElement('div');
  hdr.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  var title = document.createElement('h2');
  title.style.cssText = 'font-size:16px;font-weight:700;color:var(--grey)';
  title.textContent = '📋 Auftrags-Protokoll';
  var addBtn = document.createElement('button');
  addBtn.className = 'btn btn-green';
  addBtn.textContent = '+ Neuer Auftrag';
  addBtn.onclick = function(){ auftragView='neu'; renderAuftraege(); };
  hdr.appendChild(title); hdr.appendChild(addBtn);
  pg.appendChild(hdr);

  // KPIs
  var kpiRow = document.createElement('div');
  kpiRow.className = 'g3';
  kpiRow.style.marginBottom = '12px';
  [{label:'Offen',val:stats.offen,col:'var(--amber)',bc:'var(--amber)'},
   {label:'In Bearbeitung',val:stats.in_bearbeitung,col:'var(--blue)',bc:'var(--blue)'},
   {label:'Abgeschlossen',val:stats.abgeschlossen,col:'var(--greenM)',bc:'var(--greenM)'}
  ].forEach(function(k){
    var kpi = document.createElement('div');
    kpi.className = 'kpi';
    kpi.style.borderLeft = '4px solid '+k.bc;
    kpi.innerHTML = '<div class="k-label">'+k.label+'</div><div class="k-val" style="color:'+k.col+'">'+k.val+'</div>';
    kpiRow.appendChild(kpi);
  });
  pg.appendChild(kpiRow);

  // Table card
  var card = document.createElement('div');
  card.className = 'card';

  if(auftraege.length){
    var wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    var table = document.createElement('table');
    table.className = 't';
    table.innerHTML = '<thead><tr><th>Nr.</th><th>Typ</th><th>Kunde</th><th>Objekt</th><th>Datum</th><th>Mitarbeiter</th><th>Status</th></tr></thead>';
    var tbody = document.createElement('tbody');
    auftraege.forEach(function(a){
      var statusLbl = a.status==='offen'?'Offen':a.status==='in_bearbeitung'?'In Bearbeitung':'Abgeschlossen';
      var typLbl = a.typ==='reinigung'?'🧹 Reinigung':'🔍 Inspektion';
      var tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.innerHTML =
        '<td style="font-weight:500">'+esc(a.auftragsnummer)+'</td>'+
        '<td><span class="typ-badge typ-'+a.typ+'">'+typLbl+'</span></td>'+
        '<td>'+esc(a.kundenname||'')+'</td>'+
        '<td>'+esc(a.objekt||'')+'</td>'+
        '<td>'+esc(a.datum||'')+'</td>'+
        '<td>'+esc(a.mitarbeiter||'')+'</td>'+
        '<td><span class="status-badge status-'+a.status+'">'+statusLbl+'</span></td>';
      (function(id){ tr.onclick = function(){ openAuftrag(id); }; })(a.id);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    card.appendChild(wrap);
  } else {
    var empty = document.createElement('div');
    empty.className = 'empty';
    var emptyBtn = document.createElement('button');
    emptyBtn.className = 'btn btn-green';
    emptyBtn.textContent = 'Ersten Auftrag anlegen';
    emptyBtn.onclick = function(){ auftragView='neu'; renderAuftraege(); };
    empty.innerHTML = '<div class="ei">📋</div><div>Noch keine Aufträge.</div><br>';
    empty.appendChild(emptyBtn);
    card.appendChild(empty);
  }
  pg.appendChild(card);
  return '';
}

function renderAuftragForm(editData){
  var d = editData || {};
  var isEdit = !!editData;
  var pg = document.getElementById('page-auftraege');
  if(!pg) return '';
  pg.innerHTML = '';

  // Back button + title
  var hdr = document.createElement('div');
  hdr.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:14px';
  var backBtn = document.createElement('button');
  backBtn.className = 'btn btn-grey btn-sm';
  backBtn.textContent = '← Zurück';
  backBtn.onclick = function(){ auftragView='list'; renderAuftraege(); };
  var ttl = document.createElement('h2');
  ttl.style.cssText = 'font-size:16px;font-weight:700;color:var(--grey)';
  ttl.textContent = isEdit ? 'Auftrag bearbeiten' : 'Neuer Auftrag';
  hdr.appendChild(backBtn); hdr.appendChild(ttl);
  pg.appendChild(hdr);

  // Typ card
  var typCard = document.createElement('div');
  typCard.className = 'card';
  typCard.innerHTML = '<div class="card-title">Auftragstyp</div>';
  var typRow = document.createElement('div');
  typRow.style.cssText = 'display:flex;gap:10px;margin-bottom:4px';
  ['reinigung','inspektion'].forEach(function(typ){
    var lbl = document.createElement('label');
    lbl.id = 'lbl-'+typ[0];
    lbl.style.cssText = 'flex:1;border:2px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)';
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = 'typ'; inp.value = typ;
    if((!d.typ&&typ==='reinigung')||d.typ===typ) inp.checked = true;
    inp.onchange = function(){
      document.getElementById('lbl-r').style.borderColor = 'var(--border)';
      document.getElementById('lbl-i').style.borderColor = 'var(--border)';
      if(this.value==='reinigung') document.getElementById('lbl-r').style.borderColor='#2E7D32';
      else document.getElementById('lbl-i').style.borderColor='#1565C0';
    };
    lbl.appendChild(inp);
    var span = document.createElement('span');
    span.innerHTML = typ==='reinigung' ? '🧹 <strong>Reinigung</strong>' : '🔍 <strong>Inspektion</strong>';
    lbl.appendChild(span);
    typRow.appendChild(lbl);
  });
  typCard.appendChild(typRow);

async function saveAuftrag(editId){
  var nr = document.getElementById('af-nr').value.trim();
  var kunde = document.getElementById('af-kunde').value.trim();
  var objekt = document.getElementById('af-objekt').value.trim();
  if(!nr||!kunde||!objekt){ alert('Bitte Auftragsnummer, Kunde und Objekt ausfüllen.'); return; }
  var typ = (document.querySelector('input[name="typ"]:checked')||{value:'reinigung'}).value;
  var payload = {
    auftragsnummer:nr, typ:typ,
    datum:(document.getElementById('af-datum')||{value:''}).value,
    mitarbeiter:(document.getElementById('af-mitarbeiter')||{value:''}).value,
    status:(document.getElementById('af-status')||{value:'offen'}).value,
    kundenname:kunde, objekt:objekt,
    adresse:(document.getElementById('af-adresse')||{value:''}).value||'',
    gps:(document.getElementById('af-gps')||{value:''}).value||'',
    ansprechpartner:(document.getElementById('af-ap')||{value:''}).value||'',
    telefon:(document.getElementById('af-tel')||{value:''}).value||'',
    beschreibung:(document.getElementById('af-beschr')||{value:''}).value||'',
    sicherheitskonzept:(document.getElementById('af-sicher')||{value:''}).value||'',
  };
  var savedId = editId;
  if(editId){
    await supaFetch('auftraege','PATCH',payload,'?id=eq.'+editId);
  } else {
    payload.id = uid(); savedId = payload.id;
    await supaFetch('auftraege','POST',payload);
  }
  await loadAuftraege();
  currentAuftrag = auftraege.find(function(a){return a.id===savedId;});
  auftragView='detail'; renderAuftraege();
}

async function uploadFotos(auftragId,phase,input){
  var files = Array.from(input.files);
  for(var i=0;i<files.length;i++){
    var file = files[i];
    await new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = async function(e){
        var base64 = e.target.result;
        await supaFetch('auftrag_fotos','POST',{id:uid(),auftrag_id:auftragId,phase:phase,beschriftung:phase==='vorher'?'Vorher':phase==='nachher'?'Nachher':'Befund',bild_base64:base64,ki_analyse:''});
        resolve();
      };
      reader.readAsDataURL(file);
    });
  }
  input.value='';
  await openAuftrag(auftragId);
}

async function saveBefunde(auftragId){

  currentAuftrag = Object.assign({},currentAuftrag,{befunde:befunde,massnahmen:massnahmen});

async function autoGeocode(){
  var adresse = (document.getElementById('af-adresse')||{value:''}).value.trim();
  if(!adresse||adresse.length<5) return;
  var status = document.getElementById('gps-status');
  if(status) status.textContent='⏳ suche…';
  try {
    var url = 'https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(adresse)+'&limit=1';
    var r = await fetch(url,{headers:{'Accept-Language':'de','User-Agent':'DroneX360/1.0'}});
    var data = await r.json();
    if(data&&data[0]){
      var lat=parseFloat(data[0].lat).toFixed(6); var lon=parseFloat(data[0].lon).toFixed(6);
      var gpsInput=document.getElementById('af-gps'); if(gpsInput) gpsInput.value=lat+', '+lon;
      if(status){status.textContent='✓ gefunden'; setTimeout(function(){if(status)status.textContent='';},3000);}
    } else { if(status){status.textContent='✗ nicht gefunden'; setTimeout(function(){if(status)status.textContent='';},3000);} }
  } catch(e){ if(status){status.textContent='✗ Fehler'; setTimeout(function(){if(status)status.textContent='';},2000);} }
}

async function kiAnalyse(auftragId, btn){
  var key = getAnthropicKey();
  if(!key){ alert('Bitte zuerst Anthropic API-Key im KI-Assistenten eintragen.'); return; }
  await loadFotos(auftragId);
  var a = currentAuftrag;
  if(btn){ btn.textContent='🤖 Analysiere Fotos…'; btn.disabled=true; }
  try {
    var vorherFotos=auftragFotos.filter(function(f){return f.phase==='vorher';});
    var nachherFotos=auftragFotos.filter(function(f){return f.phase==='nachher';});
    var befundFotos=auftragFotos.filter(function(f){return f.phase==='befund';});
    var introText = "Du bist ein professioneller Drohnen-"+(a.typ==="reinigung"?"Reinigungsexperte":"Inspekteur")+" bei DroneX360 UG.\nObjekt: "+(a.objekt||"")+"\nKunde: "+(a.kundenname||"")+"\nBefunde: "+(a.befunde||"keine");
    var contentParts = [{type:'text',text:introText}];
    var addFotos = function(fotos,label){
      if(fotos.length>0){
        contentParts.push({type:'text',text:label});
        fotos.slice(0,3).forEach(function(f){
          if(f.bild_base64&&f.bild_base64.includes('base64,')){
            var b64=f.bild_base64.split('base64,')[1];
            var mtype=f.bild_base64.includes('png')?'image/png':'image/jpeg';
            contentParts.push({type:'image',source:{type:'base64',media_type:mtype,data:b64}});
          }
        });
      }
    };
    addFotos(vorherFotos,'--- VORHER-FOTOS ---');
    addFotos(befundFotos,'--- BEFUND-FOTOS ---');
    addFotos(nachherFotos,'--- NACHHER-FOTOS ---');
    var prompt = a.typ==='reinigung'?
      'Erstelle eine professionelle Reinigungsanalyse:
1. VERSCHMUTZUNGSGRAD VORHER (0-100%)
2. SAUBERKEITSGRAD NACHHER (0-100%)
3. VERBESSERUNG in Prozentpunkten
4. ERKANNTE VERSCHMUTZUNGEN
5. REINIGUNGSERGEBNIS
6. EMPFEHLUNGEN
7. FAZIT':
      'Erstelle eine professionelle Inspektionsanalyse:
1. BEFUNDÜBERSICHT
2. SCHWEREGRADBEWERTUNG (Kritisch/Mittel/Gering)
3. VERSCHMUTZUNGSGRAD (0-100%)
4. EMPFOHLENE MASSNAHMEN
5. FAZIT';
    contentParts.push({type:'text',text:prompt});
    var r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:contentParts}]})});
    var d = await r.json();
    var reply = d.content&&d.content.find(function(b){return b.type==='text';})&&d.content.find(function(b){return b.type==='text';}).text||'';
    await supaFetch('auftraege','PATCH',{bericht_intern:reply},'?id=eq.'+auftragId);
    currentAuftrag = Object.assign({},currentAuftrag,{bericht_intern:reply});
    await renderAuftraege();
  } catch(e){ alert('KI-Fehler: '+e.message); }
  if(btn){ btn.textContent='🤖 KI-Analyse'; btn.disabled=false; }
}

// ══════════════════════════════════════════════════════
// KI-ASSISTENT
// ══════════════════════════════════════════════════════
var aiMsgs = [{role:'bot',content:'Hallo! Ich bin dein DroneX360 Assistent.\n\nSag mir einfach was du eintragen möchtest:\n\n• "Heute von Offenburg nach Freiburg, 68 km, OG X553"\n• "45 Euro Kraftstoff, bar bezahlt"\n• "Ich bin um 8 Uhr gekommen, 17 Uhr Feierabend, 30 Minuten Pause"\n\nOder nutze das Mikrofon 🎤 zum Sprechen.'}];
var aiLoading = false;
var aiListening = false;
var aiRecognition = null;

async function processAiInput(text){
  if(!text.trim()||aiLoading) return;
  var key = getAnthropicKey();
  if(!key){ aiMsgs.push({role:'bot',content:'Bitte zuerst den Anthropic API-Key oben eingeben.'}); renderAssistent(); return; }
  aiMsgs.push({role:'user',content:text}); aiLoading=true; renderAssistent();
  var curUser = S.activeUser||S.drivers[0]||'';
  var system = 'Du bist ein interner Assistent fuer DroneX360 UG. Mitarbeiter: '+S.drivers.join(', ')+'. Fahrzeuge: '+S.vehicles.join(', ')+'. Aktueller Nutzer: '+curUser+'. Heute: '+new Date().toLocaleDateString('de-DE')+'.

Wenn der Nutzer eine Fahrt, Ausgabe oder Arbeitszeit beschreibt, antworte NUR mit JSON:
{"typ":"fahrt","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","fahrzeug":"KFZ","von":"Ort","nach":"Ort","km":0,"kategorie":"Geschaeftlich","zweck":""},"bestaetigung":"..."}
oder {"typ":"ausgabe","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","betrag":0,"zahlungsart":"Bar","kategorie":"Sonstiges","beschreibung":"","beleg":""},"bestaetigung":"..."}
oder {"typ":"arbeitszeit","daten":{"datum":"YYYY-MM-DD","fahrer":"Name","start":"HH:MM","end":"HH:MM","brk":30,"task":""},"bestaetigung":"..."}
Fuer allgemeine Fragen antworte normal auf Deutsch.';
  var apiMsgs = aiMsgs.filter(function(m){return m.role==='user'||m.content!=='confirmed';}).map(function(m){return {role:m.role==='user'?'user':'assistant',content:m.content};});
  try {
    var reply = await callClaude(apiMsgs,system);
    var match = reply.match(/\{[\s\S]*"typ"[\s\S]*\}/);
    if(match){ var parsed=JSON.parse(match[0]); await applyAiEntry(parsed); aiMsgs.push({role:'bot',content:'confirmed',data:parsed}); }
    else aiMsgs.push({role:'bot',content:reply});
  } catch(e){ aiMsgs.push({role:'bot',content:'Fehler: '+e.message}); }
  aiLoading=false; renderAssistent();
  setTimeout(function(){var el=document.getElementById('ai-chat-msgs');if(el) el.scrollTop=el.scrollHeight;},100);
}

async function applyAiEntry(p){
  var d=p.daten||{}; var date=d.datum||today(); var driver=d.fahrer||S.activeUser||S.drivers[0];
  if(p.typ==='fahrt') await supaFetch('fahrten','POST',{id:uid(),datum:date,fahrer:driver,fahrzeug:d.fahrzeug||'',von:d.von||'',nach:d.nach||'',km:parseFloat(d.km)||0,km_start:0,km_end:0,kategorie:d.kategorie||'Geschaeftlich',zweck:d.zweck||''});
  else if(p.typ==='ausgabe') await supaFetch('ausgaben','POST',{id:uid(),datum:date,fahrer:driver,betrag:parseFloat(d.betrag)||0,zahlungsart:d.zahlungsart||'Bar',kategorie:d.kategorie||'Sonstiges',beschreibung:d.beschreibung||'',beleg:d.beleg||'',notiz:''});
  else if(p.typ==='arbeitszeit') await supaFetch('arbeitszeiten','POST',{id:uid(),datum:date,fahrer:driver,kommen:d.start||'',gehen:d.end||'',pause_min:parseInt(d.brk)||0,taetigkeit:d.task||'',notiz:''});
  await loadAll();
}

function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Spracheingabe nur in Chrome.');return;}
  if(aiListening){if(aiRecognition) aiRecognition.stop();aiListening=false;renderAssistent();return;}
  aiRecognition=new SR(); aiRecognition.lang='de-DE'; aiRecognition.continuous=false; aiRecognition.interimResults=false;
  aiRecognition.onresult=function(e){var txt=e.results[0][0].transcript;var inp=document.getElementById('ai-text');if(inp) inp.value=txt;aiListening=false;renderAssistent();processAiInput(txt);};
  aiRecognition.onerror=aiRecognition.onend=function(){aiListening=false;renderAssistent();};
  aiRecognition.start(); aiListening=true; renderAssistent();
}

function sendAiMsg(){ var inp=document.getElementById('ai-text'); if(!inp||!inp.value.trim()) return; var txt=inp.value.trim(); inp.value=''; processAiInput(txt); }
function sendAiQuick(txt){ processAiInput(txt); }

function renderAssistent(){
  var hasKey=!!getAnthropicKey();
  var msgHtml=aiMsgs.map(function(m){
    if(m.role==='user') return '<div class="ai-msg user"><div class="ai-avatar" style="background:var(--blue)">Du</div><div class="ai-bubble">'+esc(m.content)+'</div></div>';
    if(m.content==='confirmed'&&m.data){ var rows=Object.entries(m.data.daten||{}).map(function(e){return '<div class="cc-row"><span>'+esc(e[0])+'</span><span>'+esc(String(e[1]))+'</span></div>';}).join(''); return '<div class="ai-msg bot"><div class="ai-avatar" style="background:var(--greenM)">KI</div><div class="ai-bubble"><div class="cc-card"><div class="cc-title">✅ '+esc(m.data.typ)+' eingetragen</div><div style="color:var(--greenM);font-size:11px;margin-bottom:6px">'+esc(m.data.bestaetigung||'')+'</div>'+rows+'</div></div></div>'; }
    return '<div class="ai-msg bot"><div class="ai-avatar" style="background:var(--greenM)">KI</div><div class="ai-bubble">'+esc(m.content)+'</div></div>';
  }).join('');
  var quicks=['🚗 Fahrt eintragen','💸 Ausgabe eintragen','⏱ Kommen stempeln','⏱ Gehen stempeln','⛽ Getankt','📋 Was heute eingetragen?'];
  var quickHtml=quicks.map(function(q){return '<button class="ai-quick" onclick="sendAiQuick(''+q+'')">'+q+'</button>';}).join('');
  var pg=document.getElementById('page-assistent'); if(!pg) return;
  var keyBarHtml='<div class="ai-key-bar"><span style="color:#90CAF9;font-weight:600">🔑 Anthropic API-Key:</span><input type="password" id="ai-key-inp" placeholder="sk-ant-..." value="'+(hasKey?'loaded':'')+'"/><button class="btn btn-blue btn-sm" onclick="var k=document.getElementById('ai-key-inp').value;if(k&&k!=='loaded'){setAnthropicKey(k);}renderAssistent();">Speichern</button>'+(hasKey?'<span style="color:var(--greenM);font-weight:600">✓ Verbunden</span>':'<span style="color:#EF5350;font-weight:600">⚠ Nicht verbunden</span>')+'</div>';
  var inputHtml='<div class="ai-input-row"><textarea id="ai-text" placeholder="z.B. Heute von Offenburg nach Freiburg, 68 km mit OG X553"></textarea><button class="mic-btn '+(aiListening?'recording':'')+'" onclick="startMic()" title="Spracheingabe">'+(aiListening?'🔴':'🎤')+'</button><button class="btn btn-green" onclick="sendAiMsg()" style="height:44px;padding:0 16px">'+(aiLoading?'…':'Senden')+'</button></div>';
  pg.innerHTML='<div style="padding:14px"><div style="background:linear-gradient(135deg,#1D6A3E,#185FA5);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:15px;font-weight:700">🤖 KI-Assistent</div><div style="font-size:11px;opacity:.8;margin-top:2px">Sprich oder schreib — ich trage alles ein</div></div><div style="font-size:11px;opacity:.7">Nutzer: '+esc(S.activeUser||'–')+'</div></div>'+keyBarHtml+'<div class="ai-quick-btns">'+quickHtml+'</div><div id="ai-chat-msgs">'+msgHtml+(aiLoading?'<div class="ai-msg bot"><div class="ai-avatar" style="background:var(--greenM)">KI</div><div class="ai-bubble" style="color:var(--muted)">Verarbeite…</div></div>':'')+'</div>'+inputHtml+'<div style="font-size:10px;color:var(--muted);margin-top:6px">Enter = Senden | Shift+Enter = Neue Zeile | 🎤 = Spracheingabe</div></div>';
  setTimeout(function(){var el=document.getElementById('ai-chat-msgs');if(el) el.scrollTop=el.scrollHeight;},50);
}

function renderSettings(){
  var dr=S.drivers; var veh=S.vehicles;
  document.getElementById('page-settings').innerHTML='<h2 style="font-size:16px;font-weight:700;color:var(--grey);margin-bottom:16px;padding:14px 14px 0">⚙️ Einstellungen</h2><div style="padding:0 14px"><div class="g2"><div class="card"><div class="card-title">👤 Aktiver Nutzer (Stempel)</div><div class="field" style="margin-bottom:12px"><label>Wer bist du?</label><select onchange="S.activeUser=this.value;document.getElementById('active-user-label').textContent=this.value||'Nutzer wählen';renderSettings()"><option value="">– Nutzer wählen –</option>'+dr.map(function(d){return '<option value="'+esc(d)+'"'+(S.activeUser===d?' selected':'')+'>'+esc(d)+'</option>';}).join('')+'</select></div><div style="font-size:11px;color:var(--muted)">Dieser Nutzer wird beim Stempeln verwendet.</div></div><div class="card"><div class="card-title">🚗 Fahrzeuge</div><div style="margin-bottom:10px">'+veh.map(function(v){return '<span class="chip" style="background:var(--greenL);border:1px solid var(--greenB);color:var(--greenM)">'+esc(v)+'<button onclick="removeVehicle(''+esc(v)+'')">×</button></span>';}).join('')+'</div><div style="display:flex;gap:8px"><input type="text" id="new-veh" placeholder="Kennzeichen…" style="flex:1;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;outline:none;background:var(--surface2);color:var(--text)" onkeydown="if(event.key==='Enter') addVehicle()"/><button class="btn btn-green btn-sm" onclick="addVehicle()">+ Hinzufügen</button></div></div><div class="card"><div class="card-title">👥 Mitarbeiter verwalten</div><div style="margin-bottom:10px">'+dr.map(function(d){return '<span class="chip" style="background:var(--blueL);border:1px solid var(--blueB);color:var(--blue)">'+esc(d)+'<button onclick="removeDriver(''+esc(d)+'')">×</button></span>';}).join('')+'</div><div style="display:flex;gap:8px"><input type="text" id="new-drv" placeholder="Name…" style="flex:1;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;outline:none;background:var(--surface2);color:var(--text)" onkeydown="if(event.key==='Enter') addDriver()"/><button class="btn btn-blue btn-sm" onclick="addDriver()">+ Hinzufügen</button></div></div><div class="card"><div class="card-title" style="color:var(--red)">🗑 Daten</div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-red btn-sm" onclick="if(confirm('Alle Fahrten löschen?')){S.fahrten=[];renderPage(currentPage)}">Alle Fahrten löschen</button><button class="btn btn-red btn-sm" onclick="if(confirm('Alle Ausgaben löschen?')){S.ausgaben=[];renderPage(currentPage)}">Alle Ausgaben löschen</button><button class="btn btn-red btn-sm" onclick="if(confirm('Alle Zeiteinträge löschen?')){S.zeiten=[];renderPage(currentPage)}">Alle Zeiteinträge löschen</button></div></div></div></div>';
}

function addDriver(){ var v=document.getElementById('new-drv')&&document.getElementById('new-drv').value.trim(); if(v){ var d=S.drivers; if(!d.includes(v)){d.push(v);S.drivers=d;} renderSettings(); var el=document.getElementById('new-drv'); if(el) el.value=''; }}
function removeDriver(d){ if(confirm('"'+d+'" entfernen?')){S.drivers=S.drivers.filter(function(x){return x!==d;});renderSettings();} }
function addVehicle(){ var v=document.getElementById('new-veh')&&document.getElementById('new-veh').value.trim().toUpperCase(); if(v){ var veh=S.vehicles; if(!veh.includes(v)){veh.push(v);S.vehicles=veh;} renderSettings(); var el=document.getElementById('new-veh'); if(el) el.value=''; }}
function removeVehicle(v){ if(confirm('"'+v+'" entfernen?')){S.vehicles=S.vehicles.filter(function(x){return x!==v;});renderSettings();} }

</script>
